name: Сводка по чужим роликам

# Замеры приносит домашняя машина (snimok.py): она качает ролик,
# прогоняет razbor.py и кладёт в Primeri/<ролик>/ кадры, субтитры и
# metrics.json. Видео в репозиторий не едет.
#
# Этот воркфлоу пересобирает общую сводку, как только появились новые
# замеры. Сеть ему не нужна: он только считает по json-файлам.

on:
  push:
    paths:
      - 'Primeri/**/metrics.json'
  workflow_dispatch:

concurrency:
  group: razbor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  svodka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сводка
        run: python3 svodka.py Primeri --out Primeri/SVODKA.md

      - name: Сводка на страницу запуска
        if: always()
        run: cat Primeri/SVODKA.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Коммит
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Primeri/SVODKA.md
          git diff --cached --quiet && { echo 'сводка не изменилась'; exit 0; }
          git commit -m "Сводка по чужим роликам пересобрана

          Автоматически по всем Primeri/*/metrics.json.

          [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
