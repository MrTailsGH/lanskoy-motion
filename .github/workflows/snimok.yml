name: Снимок чужих роликов

# Управление здесь, в GitHub: расписание, кнопка, логи, коммиты.
# Выполняется на своём раннере — компьютере Егора. Проба 20.09.2026
# показала, что облачный раннер GitHub получает от YouTube «Sign in to
# confirm you're not a bot»; домашний адрес такой проверки не вызывает.
#
# ВНИМАНИЕ, ТРОЕ ГРАБЛЕЙ, НА КОТОРЫХ УПАЛИ ПЕРВЫЕ ТРИ ЗАПУСКА.
#
# 1. Windows PowerShell по умолчанию стоит ExecutionPolicy Restricted и
#    отказывается запускать любые .ps1, а раннер передаёт каждый шаг
#    именно временным .ps1. Отсюда -ExecutionPolicy Bypass в shell:
#    действует только на процесс шага, политику машины не трогает.
#
# 2. Раннер пишет этот временный файл в UTF-8 без BOM, а Windows
#    PowerShell 5.1 читает его как ANSI. Любая кириллица внутри блока
#    run: превращается в кракозябры и ломает разбор скрипта — падение
#    приходит не там, где ошибка. Поэтому ВНУТРИ run: только латиница;
#    все объяснения живут в комментариях YAML, как этот.
#
# 3. Третий запуск дошёл до конца и упал на печати результата: консоль
#    Windows отдаёт cp1251, и стрелка «→» из svodka.py роняет Python с
#    UnicodeEncodeError. Отсюда PYTHONUTF8 ниже; заодно пропадают
#    кракозябры в логе запуска.

on:
  schedule:
    # 06:40 UTC по понедельникам — 09:40 по Москве, после ночного радара.
    - cron: '40 6 * * 1'
  workflow_dispatch:
    inputs:
      top:
        description: 'Сколько роликов взять из свежего RADAR.md'
        default: '5'
      url:
        description: 'Или один конкретный ролик по ссылке (тогда top не важен)'
        required: false
        default: ''

# Весь Python в задании говорит и печатает в UTF-8 — см. грабли 3.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

concurrency:
  group: snimok
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snimok:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4

      # Команда Python на Windows называется по-разному: python, python3
      # или py. Ищем один раз и кладём в окружение шага.
      # numpy нужен razbor.py для покадровых замеров, yt-dlp — качать.
      - name: Инструменты
        run: |
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $py) { $py = (Get-Command py -ErrorAction SilentlyContinue).Source }
          if (-not $py) { throw 'Python not found in runner PATH' }
          "PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Python: $py"
          & $py -m pip install --quiet --upgrade yt-dlp numpy
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed (yt-dlp, numpy)' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw 'ffmpeg not found in runner PATH - winget install Gyan.FFmpeg'
          }
          ffmpeg -version | Select-Object -First 1

      # Пустое поле url — берём горячие ролики из свежего RADAR.md.
      #
      # SNIMOK_PROXY — необязательный секрет репозитория. Он нужен, если
      # YouTube с домашнего адреса не открывается: третий запуск оборвался
      # на рукопожатии TLS у обоих роликов, это фильтрация по дороге, а не
      # поломка скрипта. Либо включить ВПН на всю систему и перезапустить
      # раннер, либо положить сюда адрес прокси.
      - name: Снять ролики
        env:
          SNIMOK_PROXY: ${{ secrets.SNIMOK_PROXY }}
        run: |
          $url = '${{ inputs.url }}'
          $top = '${{ inputs.top }}'
          if (-not $top) { $top = '5' }
          if ($url) { & $env:PY snimok.py --url $url }
          else      { & $env:PY snimok.py --top $top }
          if ($LASTEXITCODE -ne 0) { throw 'snimok.py failed' }

      - name: Сводка
        run: |
          & $env:PY svodka.py Primeri --out Primeri/SVODKA.md

      - name: Отчёт на страницу запуска
        if: always()
        run: |
          if (Test-Path Primeri/SVODKA.md) {
            Get-Content Primeri/SVODKA.md -Encoding utf8 |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      # Коммитим только кадры, субтитры и замеры: видео snimok.py удаляет сам.
      - name: Коммит
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Primeri
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'nothing new'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          git commit -m "Razbor chuzhih rolikov: snimok $stamp UTC" -m "Kadry, subtitry i zamery. Video ne kommitim." -m "[skip ci]"
          git pull --rebase origin $env:GITHUB_REF_NAME
          git push origin "HEAD:$env:GITHUB_REF_NAME"
