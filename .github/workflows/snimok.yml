name: Снимок чужих роликов

# Управление здесь, в GitHub: расписание, кнопка запуска, логи, коммиты.
# Выполняется на своём раннере — компьютере Егора. Так нужно не из прихоти:
# проба 20.09.2026 показала, что облачный раннер GitHub получает от YouTube
# «Sign in to confirm you're not a bot». Домашний адрес такой проверки не
# вызывает.
#
# Всё написано на PowerShell, а не на bash. Причина: Git для Windows кладёт
# bash.exe в папку, которой нет в PATH, и на первой же проверке шаг падает с
# «Имя bash не распознано». PowerShell в Windows есть всегда.

on:
  schedule:
    # 06:40 UTC по понедельникам — 09:40 по Москве, после ночного радара.
    - cron: '40 6 * * 1'
  workflow_dispatch:
    inputs:
      top:
        description: 'Сколько роликов взять из свежего RADAR.md'
        default: '5'
      url:
        description: 'Или один конкретный ролик по ссылке (тогда top не важен)'
        required: false
        default: ''

concurrency:
  group: snimok
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snimok:
    runs-on: self-hosted
    defaults:
      run:
        # Не просто powershell, а с обходом политики выполнения.
        # Windows по умолчанию стоит Restricted и отказывается запускать
        # любые .ps1 — а раннер именно так и передаёт шаги: пишет временный
        # скрипт и зовёт его. Первый запуск 20.09.2026 упал ровно на этом.
        # Bypass действует только на этот процесс; политика машины не
        # меняется, лезть в настройки безопасности компьютера не нужно.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты
        run: |
          # Команда Python на Windows называется по-разному — ищем один раз.
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $py) { $py = (Get-Command py -ErrorAction SilentlyContinue).Source }
          if (-not $py) { throw 'Python не найден в PATH раннера' }
          "PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Python: $py"

          # numpy нужен razbor.py для покадровых замеров, yt-dlp — качать.
          & $py -m pip install --quiet --upgrade yt-dlp numpy
          if ($LASTEXITCODE -ne 0) { throw 'не поставились yt-dlp и numpy' }

          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw 'ffmpeg не найден в PATH раннера — winget install Gyan.FFmpeg'
          }
          ffmpeg -version | Select-Object -First 1

      - name: Снять ролики
        run: |
          $url = '${{ inputs.url }}'
          $top = '${{ inputs.top }}'
          if (-not $top) { $top = '5' }
          if ($url) { & $env:PY snimok.py --url $url }
          else      { & $env:PY snimok.py --top $top }

      - name: Сводка
        run: |
          & $env:PY svodka.py Primeri --out Primeri/SVODKA.md

      - name: Отчёт на страницу запуска
        if: always()
        run: |
          if (Test-Path Primeri/SVODKA.md) {
            Get-Content Primeri/SVODKA.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Коммит
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Primeri
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'нового нет'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          git commit -m "Разбор чужих роликов: снимок $stamp UTC" -m "Кадры, субтитры и замеры. Видео не коммитим — оно удалено сразу после измерения." -m "[skip ci]"
          git pull --rebase origin $env:GITHUB_REF_NAME
          git push origin "HEAD:$env:GITHUB_REF_NAME"
