name: Радар трендов

# Радар без регулярности бесполезен: его главная метрика — прирост, а он
# считается от прошлого снимка. Руками каждый день никто гонять не станет,
# поэтому гоняет GitHub: раз в сутки, к утру по Москве, и сам коммитит
# историю обратно в репозиторий.
#
# ВАЖНО. Расписание работает только из ветки по умолчанию. Пока этот файл
# живёт в рабочей ветке, запускать можно лишь кнопкой Run workflow; после
# слияния в main расписание включится само.

on:
  schedule:
    # 05:17 UTC — 08:17 по Москве. Минута некруглая намеренно: в :00
    # у GitHub пик очереди, запуски задерживаются на десятки минут.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Записать снимок и отчёт в репозиторий'
        type: boolean
        default: true

# Два радара одновременно писали бы в один history.json.
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Зависимостей у радара нет — только стандартная библиотека.
      # Если сеть закрыта или каналы не открылись, радар выходит с ошибкой
      # и НЕ пишет ни снимок, ни отчёт: пустой снимок обнуляет прирост.
      # Красный запуск здесь — это сигнал, а не помеха.
      - name: Прогон
        run: cd radar && python3 radar.py --report RADAR.md

      # Отчёт целиком — на страницу запуска: видно, что греется, не открывая
      # репозиторий. Лимит вкладки — 1 МБ, отчёт на порядок меньше.
      - name: Отчёт на страницу запуска
        if: always()
        run: cat radar/RADAR.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Коммит истории
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add radar/history.json radar/RADAR.md
          # Первый прогон суток мог не принести изменений — это не ошибка.
          git diff --cached --quiet && { echo 'изменений нет'; exit 0; }
          git commit -m "Радар: снимок $(date -u '+%Y-%m-%d %H:%M UTC')

          Автоматический прогон. history.json нужен для прироста:
          без него следующий запуск не с чем сравнивать.

          [skip ci]"
          # Ветка могла уехать за две минуты прогона.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
