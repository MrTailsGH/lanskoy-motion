    5  взносы и подытог                    11  льготный тариф МСП
    6  рабочее место                       12  CTA
   Внутри акта события привязаны к долям блока, а не к секундам:
   дорожка другой длины — сцена подстраивается сама.
   ───────────────────────────────────────────────────────────────── */

window.META={FPS,DUR,FRAMES};

const B=T.B;
const bs=i=>B[i-1][0];              // начало блока i (нумерация с единицы)

const bdur=i=>be(i)-bs(i);
const at=(i,p)=>bs(i)+bdur(i)*p;    // доля внутри блока
const before=(i,d)=>Math.max(0,bs(i)-d);
/* Вход акта: за d секунд до его блока, но никогда раньше, чем договорён
   предыдущий блок. На короткой паузе акт просто въезжает позже. */
const enter=(i,d)=>i<=1 ? Math.max(0,bs(i)-d) : Math.max(bs(i)-d, be(i-1)+0.05);
/* Уход акта: держим картинку всю паузу и убираем ровно к приходу
   следующего акта. На длинной паузе экран не пустует, на короткой
   два акта не встречаются. */
const gone=(i,next)=>Math.max(be(i)+0.05, next-0.30);

};

const btw=(t,a,b)=>t>=a&&t<b;
const lerp=(a,b,p)=>a+(b-a)*p;

const capFit={};                 // кегль подбирается один раз на титр и кешируется
function fitCaption(html){
  if(capFit[html]!==undefined) return capFit[html];
  let size=76;
  cap.style.display='block'; cap.style.opacity='0'; cap.innerHTML=html;
  while(size>48){
    cap.style.fontSize=size+'px';
    const lh=size*1.08;
    if(cap.scrollHeight <= lh*2+2) break;
    size-=2;
  }
  capFit[html]=size; return size;
}

function onWhite(){
  return flash.style.display!=='none' && parseFloat(flash.style.opacity||0)>0.5;
}

function drawCaption(tt){
  let idx=-1;
  for(let i=0;i<CUES.length;i++) if(tt>=CUES[i][0]) idx=i;
  if(idx>=0 && CUES[idx][1]){
    const st=CUES[idx][0];
    const html=capHTML(CUES[idx][1]);
    cap.style.fontSize=fitCaption(html)+'px';
    cap.innerHTML=html;
    cap.style.opacity=seg(tt,st,0.16,E.io);
    cap.style.transform='translateY('+lerp(12,0,seg(tt,st,0.34,E.out))+'px)';
    cap.style.color = onWhite() ? '#0A0D0C' : C.ink;
    cap.style.display='block';
  } else {cap.style.opacity=0;cap.style.display='none';}
}

function drawFooter(tt){
  const w=onWhite();
  const fu=(tt>=CARD-0.10 && tt<CT+0.10)
    ? seg(tt,CARD-0.10,0.4,E.io)*(1-seg(tt,CT-0.20,0.3,E.io)) : 0;
  fCalc.style.opacity=fu; fCalc.style.color=w?'#9AA5A1':C.dim2;
  fSign.style.opacity=1;
  fName.style.color=w?'#0A0D0C':C.ink;
  fTail.style.color=w?'#5B6663':C.dim;
}
window.seek(0);
</script></body></html>
