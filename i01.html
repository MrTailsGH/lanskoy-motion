<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0D0C}
  #stage{position:relative;width:1080px;height:1920px;background:#0A0D0C;overflow:hidden}
  .abs{position:absolute}
  .blk{font-family:'Golos Text Black',sans-serif}
  .smb{font-family:'Golos Text SemiBold',sans-serif}
  .med{font-family:'Golos Text Medium',sans-serif}
  .tnum{font-variant-numeric:tabular-nums}
</style></head>
<body><div id="stage"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   И-01 v3 «Вы получаете 80, за вас отдают 134» · 1080×1920 · 30 fps
   Всё состояние — чистая функция window.seek(t). CSS-анимаций нет.
   Длина ролика не назначается: её задаёт дорожка через объект T.

   Что изменилось против v2 (23.09.2026) и откуда:
   · первый кадр не пустой — пара 80 000 → 134 000 стоит с нулевого
     кадра: это и хук, и обложка в ленте;
   · акты 4–10 — один растущий чек, а не смена карточек. Строка налога
     въезжает МЕЖДУ «на руки» и «начислено» и раздвигает их — так видно,
     что налог идёт сверху, а не из обещанного (PRIYOMY, приём 9);
   · лента актов с именами сверху (приём 1), источник нормы строкой под
     итогом (приём 2), вычёркивание в прибавке (приём 5), две суммы
     столбиком зелёным и красным (приём 12), кнопка «переслать» (приём 8);
   · движение по приёмке: вход 0,45 с синусом вместо 0,20–0,25, каскад
     0,08 с, постоянный дрейф мира 2–3 px за 3 с. У v2 покой был 90%
     при норме 73–82%, а средняя длительность движения 0,10 с при 0,24.
   ═══════════════════════════════════════════════════════════════════ */

/* ═══ ТАЙМИНГ · начало ══════════════════════════════════════════ */
const T = {
  src: "I-01.mp3 + хвост 3.50 с",
  DUR: 54.02,
  B: [
  [  0.00,   4.31]   /*  1 */,
  [  4.61,   6.52]   /*  2 */,
  [  6.77,   8.17]   /*  3 */,
  [  8.84,  12.32]   /*  4 */,
  [ 13.05,  15.34]   /*  5 */,
  [ 15.98,  18.76]   /*  6 */,
  [ 19.15,  23.88]   /*  7 */,
  [ 24.32,  25.33]   /*  8 */,
  [ 25.72,  28.70]   /*  9 */,
  [ 29.11,  31.75]   /* 10 */,
  [ 32.37,  35.87]   /* 11 */,
  [ 36.33,  39.36]   /* 12 */,
  [ 39.95,  41.45]   /* 13 */,
  [ 41.67,  45.39]   /* 14 */,
  [ 45.75,  48.32]   /* 15 */,
  [ 48.84,  50.39]   /* 16 */
  ]
};
/* ═══ ТАЙМИНГ · конец ═══════════════════════════════════════════ */

const FPS=30, DUR=T.DUR, FRAMES=Math.round(DUR*FPS);
window.META={FPS,DUR,FRAMES};
window.T=T;          // наружу: по границам блоков mixsfx.py решает,
                     // звучит эффект под речью или в паузе

/* ═══ ОФОРМЛЕНИЕ · начало ═══ вписано tokens.py, руками не править ═══ */
/* Структура — из HeroUI: лесенка поверхностей, разделитель прозрачностью,
   шкала скруглений, асимметричное движение. Цвета свои: они несут смысл
   по разделу 6 регламента. Источник — design-tokens.json. */
const C={bg:'#0A0D0C',ink:'#FFFFFF',dim:'#6E7A76',dim2:'#49544F',
         green:'#2FD38E',red:'#F0524D',teal:'#3FB7C9',
         card:'#18201E',line:'rgba(255,255,255,.15)'};
const S={c1:'#18201E',c2:'#242D2B',c3:'#38433F',c4:'#4A5551'};
const LINE2='rgba(255,255,255,.08)';
const RAD={sm:22,md:34,lg:40,full:9999};
const MOT={in:0.25,out:0.14};
/* ═══ ОФОРМЛЕНИЕ · конец ════════════════════════════════════════════ */

/* ── блоки дорожки ───────────────────────────────────────────────── */
const B=T.B;
const bs=i=>B[i-1][0];
const be=i=>B[i-1][1];
const bdur=i=>be(i)-bs(i);
const at=(i,p)=>bs(i)+bdur(i)*p;    // доля внутри блока

/* ── передача экрана между актами (как в v2, проверено) ────────────
   Уход с расфокусом до 0,33 с, пустая сцена до 0,10 с, вход — дальше.
   Длительности масштабируются по ширине паузы: узко — быстро. */
const TR={out:0.33, gap:0.10};
const pauseAfter=k=>(k>=B.length ? 1.0 : bs(k+1)-be(k));
const fadeOut=k=>Math.min(TR.out, Math.max(0.13, pauseAfter(k)*0.62));
const gapAfter=k=>Math.min(TR.gap, Math.max(0.03, pauseAfter(k)*0.19));
const swap=i=>{
  if(i<1) return 0;
  if(i>=B.length) return DUR;
  const a=be(i), b=bs(i+1), m=(a+b)/2;
  return (b-a)<0.06 ? m : Math.min(Math.max(m, a+0.03), b-0.03);
};
const gone=k=>Math.max(be(k)+0.02, swap(k)-fadeOut(k));
const enter=(i,d)=>i<=1 ? Math.max(0,bs(i)-d)
  : Math.max(bs(i)-d, gone(i-1)+fadeOut(i-1)+gapAfter(i-1));

const X0=60, CW=760;                        // рабочая колонка: safe zone 9:16

/* ── время ───────────────────────────────────────────────────────── */
const cl=x=>x<0?0:x>1?1:x;
const E={
  out:  t=>1-Math.pow(1-t,3),
  io:   t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  /* синус для входов: скорость держится у пика дольше, чем у кубика,
     и замер видит событие целиком, а не рывок в первой трети */
  s:    t=>-(Math.cos(Math.PI*t)-1)/2,
  back: t=>{const c=1.30158,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  lin:  t=>t
};
const seg=(t,s,d,e=E.out)=>e(cl((t-s)/d));
const lerp=(a,b,p)=>a+(b-a)*p;
const IN=0.45, STAG=0.08;                   // вход и каскад v3

/* ── формат ──────────────────────────────────────────────────────── */
const ru=n=>Math.round(n).toLocaleString('ru-RU').replace(/[   ]/g,' ');
const rub=n=>ru(n)+' ₽';
const cnt=(t,s,d,a,b)=>Math.round(lerp(a,b,seg(t,s,d,E.io))/100)*100;

/* ── конструктор ─────────────────────────────────────────────────── */
const stage=document.getElementById('stage');
const px=v=>v+'px';
const N_=(par,cls,css,txt)=>{const d=document.createElement('div');
  d.className='abs '+(cls||'');Object.assign(d.style,css||{});
  if(txt!==undefined)d.innerHTML=txt;par.appendChild(d);return d;};
const E_=(cls,css,txt)=>N_(stage,cls,css,txt);

/* ═══ ФОН ════════════════════════════════════════════════════════
   Свечение двух цветов: зелёное — деньги, красное — потеря. Их доля
   меняется по смыслу акта, а сами пятна медленно плывут: фон никогда
   не стоит, но глазом это не читается как движение. */
const glowG=E_('',{left:'-360px',top:'300px',width:'1800px',height:'1800px',
  background:'radial-gradient(circle at 50% 50%, rgba(47,211,142,.10) 0%, rgba(47,211,142,.05) 22%, rgba(47,211,142,.02) 44%, rgba(10,13,12,0) 70%)'});
const glowR=E_('',{left:'-360px',top:'300px',width:'1800px',height:'1800px',
  background:'radial-gradient(circle at 50% 50%, rgba(240,82,77,.12) 0%, rgba(240,82,77,.055) 22%, rgba(240,82,77,.02) 44%, rgba(10,13,12,0) 70%)'});
const grid=E_('',{left:0,top:0,width:'1080px',height:'1920px',opacity:'.26',
  backgroundImage:'url(assets/backgrounds/bg-black.jpg)',backgroundSize:'cover',
  mixBlendMode:'screen',pointerEvents:'none'});
const vign=E_('',{left:0,top:0,width:'1080px',height:'1920px',
  background:'radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 38%, rgba(0,0,0,.6) 100%)'});
const floor=E_('',{left:0,top:'1360px',width:'1080px',height:'560px',
  background:'linear-gradient(180deg, rgba(10,13,12,0) 0%, rgba(8,11,10,.5) 30%, rgba(7,10,9,.85) 62%, #070A09 100%)'});

/* мир: всё содержимое актов живёт в нём и медленно дрейфует */
const world=E_('',{left:0,top:0,width:'1080px',height:'1920px'});
const W_=(cls,css,txt)=>N_(world,cls,css,txt);

/* доля красного по времени: [момент, доля] — смысл акта, а не декор */
const MOOD=()=>[[0,.15],[at(1,.70),.55],[bs(2),.75],[be(3),.45],
  [bs(5),.60],[bs(7),.65],[bs(10),1],[be(10),.9],[bs(11),.55],[be(12),.4],
  [bs(13),.15],[at(14,.8),0],[bs(16),.05],[DUR,.05]];
function mood(t){
  const k=MOOD(); if(t<=k[0][0]) return k[0][1];
  for(let i=1;i<k.length;i++) if(t<=k[i][0]){
    const p=(t-k[i-1][0])/Math.max(.001,k[i][0]-k[i-1][0]);
    return lerp(k[i-1][1],k[i][1],E.s(cl(p)));
  }
  return k[k.length-1][1];
}

/* ═══ ХУК: 80 000 → 134 000 с нулевого кадра ════════════════════ */
const hook=W_('',{left:px(X0),top:'540px',width:px(CW),height:'700px'});
const hkL1=N_(hook,'med',{left:0,top:0,font:'30px "Golos Text Medium"',letterSpacing:'.16em',
  color:C.dim,whiteSpace:'nowrap'},'ВЫ ПОЛУЧАЕТЕ');
const hkV1=N_(hook,'blk tnum',{left:'-4px',top:'40px',font:'132px "Golos Text Black"',
  letterSpacing:'-.035em',color:C.ink,whiteSpace:'nowrap',lineHeight:'1'},rub(80000));
const hkArr=N_(hook,'',{left:'22px',top:'196px',width:'8px',height:'0px',borderRadius:'4px',
  background:C.red});
const hkArrH=N_(hook,'',{left:'8px',top:'232px',width:'36px',height:'36px',
  borderRight:'8px solid '+C.red,borderBottom:'8px solid '+C.red,borderRadius:'3px',
  transform:'rotate(45deg)'});
const hkL2=N_(hook,'med',{left:0,top:'300px',font:'30px "Golos Text Medium"',letterSpacing:'.16em',
  color:C.red,whiteSpace:'nowrap'},'ЗА ВАС ОТДАЮТ');
const hkV2=N_(hook,'blk tnum',{left:'-4px',top:'340px',font:'132px "Golos Text Black"',
  letterSpacing:'-.035em',color:C.red,whiteSpace:'nowrap',lineHeight:'1'},rub(80000));
const hkChip=N_(hook,'smb',{left:0,top:'512px',font:'34px "Golos Text SemiBold"',color:C.red,
  background:'rgba(240,82,77,.14)',border:'1px solid rgba(240,82,77,.35)',
  borderRadius:px(RAD.full),padding:'14px 30px',whiteSpace:'nowrap'},
  'почти 40 000 — государству');

/* ═══ ЧЕК: акты 4–10 одним растущим предметом ══════════════════
   Строки стоят в слотах; слот может смениться, и строка переезжает.
   Так налог въезжает между «на руки» и «начислено», раздвигая их. */
const HEAD=112, RH=86;
const card=W_('',{left:px(X0),top:'520px',width:px(CW),height:'760px'});
const cardBg=N_(card,'',{left:0,top:0,width:px(CW),height:'200px',background:S.c1,
  border:'1px solid '+LINE2,borderBottom:'none',borderRadius:'40px 40px 0 0',
  boxShadow:'0 40px 90px rgba(0,0,0,.45)'});
/* зубчатый край чека: одна полоса SVG, ездит за высотой карточки */
const ZIG=(()=>{let d='M0 0 ';for(let x=0;x<=CW;x+=38){d+='L'+(x+19)+' 20 L'+(x+38)+' 0 ';}
  return '<svg width="'+CW+'" height="22" viewBox="0 0 '+CW+' 22"><path d="'+d+'Z" fill="'+S.c1+'"/></svg>';})();
const cardZig=N_(card,'',{left:0,top:'200px',width:px(CW),height:'22px'},ZIG);
const ckHead=N_(card,'med',{left:'40px',top:'38px',font:'25px "Golos Text Medium"',
  letterSpacing:'.16em',color:C.dim,whiteSpace:'nowrap'},'ЧЕК · ВАША ЦЕНА ДЛЯ РАБОТОДАТЕЛЯ');
const ckRule=N_(card,'',{left:'40px',top:'92px',width:px(CW-80),height:'0',
  borderTop:'2px dashed rgba(255,255,255,.12)'});

function mkRow(lab,kind,col){
  const r=N_(card,'',{left:0,top:'0',width:px(CW),height:px(RH),opacity:0});
  const sub=kind==='sub';
  const rule=sub?N_(r,'',{left:'40px',top:'2px',width:px(CW-80),height:'0',
    borderTop:'2px dashed rgba(255,255,255,.14)'}):null;
  const L=N_(r,sub?'smb':'med',{left:'40px',top:sub?'30px':'24px',
    font:sub?'25px "Golos Text SemiBold"':'34px "Golos Text Medium"',
    letterSpacing:sub?'.14em':'0',color:sub?C.dim:'#C9D2CF',whiteSpace:'nowrap'},lab);
  const V=N_(r,'blk tnum',{right:'40px',top:'14px',font:'52px "Golos Text Black"',
    color:col,whiteSpace:'nowrap',letterSpacing:'-.01em'},'');
  return {r,L,V,rule};
}
/* слоты: 0 на руки · 1 НДФЛ · 2 начислено · 3 взносы · 4 итого · 5 место */
const rkRuk =mkRow('на руки','line',C.green);
const rkNdfl=mkRow('НДФЛ 13%','line',C.red);
const rkNach=mkRow('НАЧИСЛЕНО','sub',C.ink);
const rkVz  =mkRow('взносы 30%','line',C.red);
const rkItog=mkRow('ИТОГО','sub',C.ink);
const rkMest=mkRow('место и техника','line','#9AA5A1');

/* ═══ ИТОГ поверх чека ═════════════════════════════════════════ */
const totScrim=W_('',{left:'-24px',top:'-24px',width:'1128px',height:'1968px',background:'rgba(10,13,12,.9)'});
const tot=W_('',{left:px(X0),top:'600px',width:px(CW),height:'600px'});
const totL=N_(tot,'med',{left:0,top:0,font:'30px "Golos Text Medium"',letterSpacing:'.16em',
  color:C.dim,whiteSpace:'nowrap'},'ВЫ СТОИТЕ РАБОТОДАТЕЛЮ');
const totV=N_(tot,'blk tnum',{left:'-4px',top:'44px',font:'148px "Golos Text Black"',
  letterSpacing:'-.04em',color:C.red,whiteSpace:'nowrap',lineHeight:'1'},rub(134000));
const totS=N_(tot,'med',{left:0,top:'212px',font:'46px "Golos Text Medium"',color:C.ink,
  whiteSpace:'nowrap'},'в месяц — вместо 80 000');
/* источник нормы строкой (PRIYOMY, приём 2): правило «цифра только с
   нормой» соблюдалось в текстах, а на экране его не было видно */
const totSrc=N_(tot,'',{left:0,top:'330px',width:px(CW)});
const SRC=[['НДФЛ 13%','ст. 224 НК РФ'],['взносы 30%','п. 3 ст. 425 НК РФ']];
const srcRows=SRC.map((s,i)=>N_(totSrc,'med',{left:0,top:(i*46)+'px',display:'flex',
  alignItems:'center',gap:'14px',font:'26px "Golos Text Medium"',color:C.dim,whiteSpace:'nowrap'},
  '<span style="color:#9AA5A1">'+s[0]+'</span>'+
  '<span style="display:inline-block;width:70px;height:2px;background:'+C.dim2+'"></span>'+
  '<span>'+s[1]+'</span>'));

/* ═══ ДОЛЯ: две суммы столбиком (приём 12) ═══════════════════════ */
const split=W_('',{left:px(X0),top:'560px',width:px(CW),height:'640px'});
const spHead=N_(split,'med',{left:0,top:0,font:'28px "Golos Text Medium"',letterSpacing:'.16em',
  color:C.dim,whiteSpace:'nowrap'},'ИЗ 134 000 ₽ В МЕСЯЦ');
const spAL=N_(split,'smb',{left:0,top:'64px',font:'32px "Golos Text SemiBold"',color:C.green,
  letterSpacing:'.08em'},'ВАМ');
const spAV=N_(split,'blk tnum',{left:'-4px',top:'104px',font:'118px "Golos Text Black"',
  color:C.green,letterSpacing:'-.035em',whiteSpace:'nowrap',lineHeight:'1'},rub(80000));
const spBL=N_(split,'smb',{left:0,top:'256px',font:'32px "Golos Text SemiBold"',color:C.red,
  letterSpacing:'.08em'},'ГОСУДАРСТВУ');
const spBV=N_(split,'blk tnum',{left:'-4px',top:'296px',font:'118px "Golos Text Black"',
  color:C.red,letterSpacing:'-.035em',whiteSpace:'nowrap',lineHeight:'1'},rub(39600));
/* полоса целого: три доли с зазором цвета фона вместо обводки */
const SPLIT=[{v:80000,c:C.green},{v:39600,c:C.red},{v:14400,c:'#4A5551'}];
const SPSUM=SPLIT.reduce((a,x)=>a+x.v,0);
const spBar=N_(split,'',{left:0,top:'470px',width:px(CW),height:'30px'});
const spSeg=[];{let x=0;SPLIT.forEach((d,i)=>{const w=CW*d.v/SPSUM;
  spSeg.push({el:N_(spBar,'',{left:px(x+(i?2:0)),top:0,height:'30px',width:'0px',
    background:d.c,borderRadius:i===0?'15px 0 0 15px':i===2?'0 15px 15px 0':'0'}),x0:x,w:w-(i?2:0)});
  x+=w;});}
const spLeg=N_(split,'med',{left:0,top:'524px',font:'26px "Golos Text Medium"',color:C.dim,
  whiteSpace:'nowrap'},'<span style="color:#9AA5A1">серое</span> — место и техника');

/* ═══ БЕЛЫЙ АКТ: одна инверсия на ролик (приём 7) ═════════════ */
const white=E_('',{left:0,top:0,width:'1080px',height:'1920px',background:'#FFFFFF'});
const wBig=N_(white,'blk tnum',{left:px(X0-6),top:'560px',font:'300px "Golos Text Black"',
  color:C.red,letterSpacing:'-.05em',lineHeight:'1',whiteSpace:'nowrap'},'40%');
const wTxt=N_(white,'blk',{left:px(X0),top:'900px',width:px(CW),font:'62px "Golos Text Black"',
  color:'#0A0D0C',lineHeight:'1.1',letterSpacing:'-.01em'},
  'вашей цены вы&nbsp;никогда не&nbsp;держали в&nbsp;руках');
const wSub=N_(white,'med',{left:px(X0),top:'1100px',font:'30px "Golos Text Medium"',
  color:'#6B7672',whiteSpace:'nowrap'},'54 000 из 134 000 ₽');

/* ═══ ПРИБАВКА: вычёркивание и стрелка (приёмы 3 и 5) ════════════ */
const raise=W_('',{left:px(X0),top:'560px',width:px(CW),height:'700px'});
const rsL1=N_(raise,'med',{left:0,top:0,font:'30px "Golos Text Medium"',letterSpacing:'.16em',
  color:C.dim,whiteSpace:'nowrap'},'ВЫ ПРОСИТЕ');
const rsV1=N_(raise,'blk tnum',{left:'-4px',top:'40px',font:'120px "Golos Text Black"',
  color:C.ink,letterSpacing:'-.035em',whiteSpace:'nowrap',lineHeight:'1'},'+ ?');
const rsStrike=N_(raise,'',{left:'-8px',top:'98px',height:'10px',width:'0px',
  background:C.red,borderRadius:'5px',transform:'rotate(-3deg)',transformOrigin:'0 50%'});
const rsArr=N_(raise,'',{left:'22px',top:'184px',width:'8px',height:'0px',borderRadius:'4px',
  background:C.green});
const rsArrH=N_(raise,'',{left:'8px',top:'220px',width:'36px',height:'36px',
  borderRight:'8px solid '+C.green,borderBottom:'8px solid '+C.green,borderRadius:'3px',
  transform:'rotate(45deg)'});
const rsL2=N_(raise,'med',{left:0,top:'290px',font:'30px "Golos Text Medium"',letterSpacing:'.16em',
  color:C.green,whiteSpace:'nowrap'},'А НА САМОМ ДЕЛЕ');
const rsV2=N_(raise,'blk tnum',{left:'-4px',top:'330px',font:'120px "Golos Text Black"',
  color:C.green,letterSpacing:'-.035em',whiteSpace:'nowrap',lineHeight:'1'},'+10 000 ₽');
/* кнопка пересылки (приём 8): адресная, одно действие */
const rsShare=N_(raise,'',{left:0,top:'520px',display:'flex',alignItems:'center',gap:'18px'});
const rsBtn=N_(rsShare,'smb',{position:'relative',font:'32px "Golos Text SemiBold"',color:C.teal,
  border:'2px solid '+C.teal,borderRadius:px(RAD.full),padding:'14px 30px',whiteSpace:'nowrap'},
  '↗ переслать');
const rsWho=N_(rsShare,'med',{position:'relative',font:'28px "Golos Text Medium"',color:C.dim,
  whiteSpace:'nowrap'},'тому, кто идёт за&nbsp;прибавкой');

/* ═══ CTA: профиль в Телеграме (формат принят в v2) ═══════════════ */

function capHTML(s){
  if(!s)return '';
  const p=s.split('|');
  const col=p[2]==='r'?C.red:p[2]==='g'?C.green:C.ink;
  const L=[];
  if(p[0]) L.push('<span style="display:block">'+p[0]+'</span>');
  L.push('<span style="display:block;color:'+col+'">'+p[1]+'</span>');
  return L.join('');
}

let NOW=0;
/* Мягкость ухода несёт расфокус, а не прозрачность: blur и затемнение
   считаются из прозрачности. При o≈1 фильтр снимается — blur дорог. */
function show(el,o,y,s){
  el.style.opacity=o;
  el.style.transform='translateY('+(y||0)+'px)'+(s?' scale('+s+')':'');
  el.style.filter = o>0.995 ? 'none'
    : 'blur('+((1-o)*13).toFixed(1)+'px) brightness('+(0.45+0.55*o).toFixed(2)+')';
  el.style.display=o<=0.001?'none':'block';
}
/* вход детали: синус 0,45 с, подъём на 26 px, расфокус снимается */
function rise(el,t,s,dy){
  const p=seg(t,s,IN,E.s);
  el.style.opacity=p;
  el.style.transform='translateY('+lerp(dy===undefined?26:dy,0,p).toFixed(1)+'px)';
  el.style.filter=p>0.995?'none':'blur('+((1-p)*8).toFixed(1)+'px)';
}
/* акт целиком: вход синусом, уход быстрее по ширине паузы */
function act(el,t,a,out,k){
  const o=seg(t,a,IN,E.s)*(1-seg(t,out,fadeOut(k),E.io));
  show(el,o,lerp(30,0,seg(t,a,IN,E.s)) - 24*seg(t,out,fadeOut(k),E.io));
  return o;
}

     замирает, но глазом это не читается как движение */
  world.style.transform='translate('+(2.8*Math.sin(tt*2*Math.PI/19)).toFixed(2)+'px,'+
    (2.0*Math.sin(tt*2*Math.PI/27+1)).toFixed(2)+'px)';
  const m=mood(tt);
  glowR.style.opacity=m.toFixed(3); glowG.style.opacity=(1-m*.85).toFixed(3);
  const gx=Math.sin(tt*2*Math.PI/23)*40, gy=Math.cos(tt*2*Math.PI/31)*30;
  glowG.style.transform='translate('+gx.toFixed(1)+'px,'+gy.toFixed(1)+'px)';
  glowR.style.transform='translate('+(-gx).toFixed(1)+'px,'+(gy*.6).toFixed(1)+'px)';

  /* ── хук ── */
  if(tt<HK_OUT+fadeOut(3)+0.05){
    const o=1-seg(tt,HK_OUT,fadeOut(3),E.io);
    show(hook,o,-24*seg(tt,HK_OUT,fadeOut(3),E.io),lerp(1.035,1,seg(tt,0,0.9,E.s)));
    hook.style.transformOrigin='0 30%';
    hkL1.style.opacity=1; hkV1.style.opacity=1;
    const a=seg(tt,HK_ARR,0.40,E.s);
    hkArr.style.height=px(Math.round(40*a)); hkArrH.style.opacity=seg(tt,HK_ARR+0.22,0.2,E.io);
    rise(hkL2,tt,HK_ARR+0.08);
    rise(hkV2,tt,HK_ARR+0.08+STAG);
    hkV2.textContent=rub(cnt(tt,HK_CNT,1.05,80000,134000));
    const c=seg(tt,HK_CHIP,IN,E.s);
    hkChip.style.opacity=c;
    hkChip.style.transform='translateY('+lerp(20,0,c).toFixed(1)+'px) scale('+lerp(.92,1,seg(tt,HK_CHIP,0.5,E.back)).toFixed(3)+')';
    hkChip.style.transformOrigin='0 50%';
  } else show(hook,0);

  /* ── чек ── */
  if(tt>=RC-0.05 && tt<CARD_OUT+fadeOut(10)+0.05){
    const outP=seg(tt,CARD_OUT,fadeOut(10),E.io);
    /* под итогом чек гаснет ниже порога наложения, но не пропадает */
    const dim=lerp(1,0.08,seg(tt,TOT,0.40,E.io));
    const o=seg(tt,RC,IN,E.s)*dim*(1-outP);
    show(card,o,lerp(40,0,seg(tt,RC,IN,E.s)),lerp(1,0.97,seg(tt,TOT,0.5,E.io)));
    card.style.transformOrigin='50% 0';
    rise(ckHead,tt,RC+0.05,12); rise(ckRule,tt,RC+0.10,0);

    /* слот строки НДФЛ появляется в T_NDFL и раздвигает соседей */
    const ins=seg(tt,T_NDFL,IN,E.s);
    const place=(row,slot,on)=>{
      const p=seg(tt,on,IN,E.s);
      row.r.style.top=px(HEAD+slot*RH);
      row.r.style.opacity=p;
      row.r.style.transform='translateX('+lerp(-26,0,p).toFixed(1)+'px)';
      row.r.style.filter=p>0.995?'none':'blur('+((1-p)*7).toFixed(1)+'px)';
      return p;
    };
    const pR=place(rkRuk,0,T_RUK);
    rkRuk.V.textContent=rub(80000);
    const pN=place(rkNach,1+ins,T_NACH);
    rkNach.V.textContent=rub(cnt(tt,T_NACH+0.25,0.55,80000,92000));
    const pT=place(rkNdfl,1,T_NDFL);
    rkNdfl.r.style.transform='translateX('+lerp(-40,0,ins).toFixed(1)+'px) scaleY('+lerp(.4,1,ins).toFixed(3)+')';
    rkNdfl.V.textContent= tt<T_NDFV ? '+ ?' : '+'+rub(cnt(tt,T_NDFV,0.50,0,12000));
    const pV=place(rkVz,3,T_VZ);
    rkVz.V.textContent= tt<T_VZV ? '+ ?' : '+'+rub(cnt(tt,T_VZV,0.55,0,27600));
    const pI=place(rkItog,4,T_ITOG);
    rkItog.V.textContent=rub(cnt(tt,T_ITOG+0.10,0.40,92000,119600));
    const pM=place(rkMest,5,T_MEST);
    rkMest.V.textContent= tt<T_MESV ? '+ ?' : '+'+rub(cnt(tt,T_MESV,0.45,0,14400));

    /* высота чека растёт за строками — предмет удлиняется, как лента */
    const rows=pR+pN+ins+pV+pI+pM;
    const h=HEAD+Math.max(0.6,rows)*RH+18;
    cardBg.style.height=px(Math.round(h)); cardZig.style.top=px(Math.round(h));
  } else show(card,0);

  /* ── итог ── */
  if(tt>=TOT-0.05 && tt<CARD_OUT+fadeOut(10)+0.05){
    const outP=seg(tt,CARD_OUT,fadeOut(10),E.io);
    totScrim.style.display='block';
    totScrim.style.opacity=(seg(tt,TOT,0.35,E.io)*(1-outP)).toFixed(3);
    act(tot,tt,TOT,CARD_OUT,10);
    tot.style.transformOrigin='0 30%';
    rise(totL,tt,TOT);
    const pv=seg(tt,TOT,IN,E.s);
    totV.style.opacity=pv;
    totV.style.transform='translateY('+lerp(30,0,pv).toFixed(1)+'px) scale('+lerp(.9,1,seg(tt,TOT,0.55,E.back)).toFixed(3)+')';
    totV.style.transformOrigin='0 60%';
    totV.textContent=rub(cnt(tt,TOT,0.55,119600,134000));
    rise(totS,tt,TOT+0.30);
    rise(srcRows[0],tt,TOT_SRC); rise(srcRows[1],tt,TOT_SRC+STAG);
    srcRows.forEach(r=>r.style.display='flex');
  } else {show(tot,0); totScrim.style.display='none';}

  /* ── доля ── */
  if(tt>=SP-0.05 && tt<SP_OUT+fadeOut(11)+0.05){
    act(split,tt,SP,SP_OUT,11);
    rise(spHead,tt,SP);
    rise(spAL,tt,SP_A-0.10); rise(spAV,tt,SP_A-0.10+STAG);
    rise(spBL,tt,SP_B-0.10); rise(spBV,tt,SP_B-0.10+STAG);
    spBV.textContent=rub(cnt(tt,SP_B-0.02,0.55,0,39600));
    const f=seg(tt,SP_BAR,SPFILL,E.io);
    spSeg.forEach(s=>{
      const vis=cl((f*CW - s.x0)/Math.max(1,s.w));
      s.el.style.width=px(Math.round(s.w*vis));
    });
    rise(spLeg,tt,SP_BAR+SPFILL*0.6,10);
  } else show(split,0);

  /* ── белый акт ── */
  if(tt>=FL-0.02 && tt<FL_OUT+0.40){
    const o=seg(tt,FL,0.18,E.io)*(1-seg(tt,FL_OUT,0.36,E.io));
    white.style.display='block'; white.style.opacity=o.toFixed(3);
    const b=seg(tt,FL+0.05,IN,E.s);
    wBig.style.opacity=b;
    wBig.style.transform='translateY('+lerp(40,0,b).toFixed(1)+'px) scale('+lerp(.86,1,seg(tt,FL+0.05,0.6,E.back)).toFixed(3)+')';
    wBig.style.transformOrigin='0 70%';
    rise(wTxt,tt,FL_TXT,30);
    rise(wSub,tt,FL_TXT+0.45,14);
  } else {white.style.display='none'; white.style.opacity=0;}

  /* ── прибавка ── */
  if(tt>=RS-0.05 && tt<RS_OUT+fadeOut(15)+0.05){
    act(raise,tt,RS,RS_OUT,15);
    rise(rsL1,tt,RS); rise(rsV1,tt,RS+STAG);
    rsV1.textContent = tt<RS_V1 ? '+ ?' : '+'+rub(cnt(tt,RS_V1,0.35,0,10000));
    const st=seg(tt,RS_STR,0.40,E.s);
    rsStrike.style.width=px(Math.round(st*(rsV1.offsetWidth+16)));
    rsV1.style.color = st>0.5 ? '#4A5551' : C.ink;
    const a=seg(tt,RS_ARR,0.40,E.s);
    rsArr.style.height=px(Math.round(40*a)); rsArrH.style.opacity=seg(tt,RS_ARR+0.22,0.2,E.io);
    rise(rsL2,tt,RS_ARR+0.10); rise(rsV2,tt,RS_ARR+0.10+STAG);
    rsV2.textContent='+'+rub(cnt(tt,RS_V2,0.60,10000,14900));
    const sh=seg(tt,RS_SH,IN,E.s);
    rsShare.style.opacity=sh;
    rsShare.style.transform='translateY('+lerp(20,0,sh).toFixed(1)+'px)';
    rsShare.style.display=sh<=0.001?'none':'flex';
  } else show(raise,0);

  /* ── CTA ── */
  if(tt>=CT-0.05){
    show(cta,seg(tt,CT,0.22,E.io));
    const puls=Math.sin((tt-CT)*5.2);
    chev.style.opacity=seg(tt,CT,0.3,E.io);
    chevD.forEach((d,i)=>{
      d.style.opacity=0.45+0.55*Math.max(0,Math.sin((tt-CT)*5.2-i*0.5));
      d.style.transform='translateY('+(puls*4)+'px) rotate(-45deg)';
    });
    show(ctaH ,seg(tt,CT+0.05,0.3,E.io),lerp(18,0,seg(tt,CT+0.05,IN,E.s)));
    ctaH.style.display=seg(tt,CT+0.05,0.3,E.io)<=0.001?'none':'flex';
    show(ctaW2,seg(tt,CT+0.20,0.3,E.io),lerp(18,0,seg(tt,CT+0.20,IN,E.s)));
    const cO=seg(tt,CT+0.32,0.30,E.io);
    show(pcard,cO,lerp(34,0,seg(tt,CT+0.32,0.5,E.s)),lerp(0.94,1,seg(tt,CT+0.32,0.5,E.back)));
    pcard.style.transformOrigin='50% 0%';
    const hO=seg(tt,CT+0.52,0.28,E.io);
    pcAva.style.opacity=hO; pcName.style.opacity=hO; pcNick.style.opacity=hO;
    pcPills.forEach((el,i)=>{
      const on=CT+0.74+i*STAG*1.5;
      el.style.opacity=seg(tt,on,0.24,E.io);
      el.style.transform='translateY('+lerp(12,0,seg(tt,on,0.34,E.s))+'px)';
    });
    show(pcDesc,seg(tt,CT+1.14,0.30,E.io),lerp(10,0,seg(tt,CT+1.14,0.4,E.s)));
    show(pcLink,seg(tt,CT+1.36,0.28,E.io),lerp(10,0,seg(tt,CT+1.36,0.4,E.s)));
    pcLink.style.display=seg(tt,CT+1.36,0.28,E.io)<=0.001?'none':'inline-block';
    const bO=seg(tt,CT+1.56,0.28,E.io);
    pcBtn1.style.opacity=bO; pcBtn2.style.opacity=bO;
    pcBtn1.style.transform='scale('+lerp(0.92,1,seg(tt,CT+1.56,0.42,E.back))+')';
    show(ctaPil,seg(tt,CT+1.84,0.30,E.io));
    ctaPil.style.display=seg(tt,CT+1.84,0.30,E.io)<=0.001?'none':'flex';
    ctaPilIn.style.transform='scale('+lerp(0.90,1,seg(tt,CT+1.84,0.46,E.back))+')';
  } else show(cta,0);

  drawRail(tt); drawCaption(tt); drawFooter(tt);
};

function onWhite(){
  return white.style.display!=='none' && parseFloat(white.style.opacity||0)>0.5;
}

/* плашка ленты: активная заливается бирюзой, лента съезжает так,
   чтобы активная стояла у левой трети колонки */
function drawRail(tt){
  let k=0; CHIP_AT.forEach((a,i)=>{ if(tt>=a) k=i; });
  const prev=Math.max(0,k-1);
  const p=k===0 ? 1 : seg(tt,CHIP_AT[k],IN,E.s);
  const target=i=>chips[i].x+chips[i].w/2;
  const off=300 - lerp(k>0?target(prev):target(0), target(k), k>0?p:1);
  railIn.style.transform='translateX('+off.toFixed(1)+'px)';
  const w=onWhite();
  chips.forEach((ch,i)=>{
    const on = i===k ? p : (i===prev && k>0 ? 1-p : 0);
    ch.bg.style.opacity=on.toFixed(3);
    ch.tx.style.color = on>0.5 ? '#07201C' : (w ? '#6B7672' : C.dim);
    ch.c.style.borderColor = w ? 'rgba(0,0,0,.12)' : LINE2;
  });
  rail.style.opacity = 1-seg(tt,DUR-0.6,0.5,E.io);
}

/* Кегль подбирается один раз на титр и кешируется.
   У титра фиксированная высота 200 px, и прежний замер через scrollHeight
   никогда не давал меньше 200 — подбор проваливался до минимума, и все
   титры во всех пяти роликах шли кеглем 48 вместо 76. Поймано 23.09.2026.
   Мерить надо высоту содержимого, а не коробки, и по раскладке
   (offsetHeight): scrollHeight добавляет 4 px вылета букв за строку, и
   двухстрочный титр на 76 px «не влезал» на эти четыре пикселя. */
const capFit={};
function fitCaption(html){
  if(capFit[html]!==undefined) return capFit[html];
  let size=76;
  cap.style.display='block'; cap.style.opacity='0'; cap.innerHTML=html;
  cap.style.height='auto';
  while(size>48){
    cap.style.fontSize=size+'px';
    const lh=size*1.08;
    if(cap.offsetHeight <= lh*2+2) break;
    size-=2;
  }
  cap.style.height='200px';
  capFit[html]=size; return size;
}

/* титр: строки въезжают по очереди, снизу вверх из расфокуса */
function drawCaption(tt){
  let idx=-1;
  for(let i=0;i<CUES.length;i++) if(tt>=CUES[i][0]) idx=i;
  if(idx>=0 && CUES[idx][1]){
    const st=CUES[idx][0];
    const html=capHTML(CUES[idx][1]);
    const sz=fitCaption(html);
    if(cap.dataset.h!==html){cap.innerHTML=html; cap.dataset.h=html;}
    cap.style.fontSize=sz+'px';
    cap.style.opacity=1; cap.style.display='block';
    cap.style.color = onWhite() ? '#0A0D0C' : C.ink;
    [...cap.children].forEach((ln,i)=>{
      const s0=st+i*0.09;
      const p=seg(tt,s0,0.36,E.s);
      ln.style.opacity=seg(tt,s0,0.20,E.io);
      ln.style.transform='translateY('+lerp(22,0,p).toFixed(1)+'px)';
      ln.style.filter=p>0.99?'none':'blur('+((1-p)*6).toFixed(1)+'px)';
    });
  } else {cap.style.opacity=0;cap.style.display='none';cap.dataset.h='';}
}

function drawFooter(tt){
  const w=onWhite();
  const fu=(tt>=RC-0.10 && tt<CT+0.10)
    ? seg(tt,RC-0.10,0.4,E.io)*(1-seg(tt,CT-0.20,0.3,E.io)) : 0;
  fCalc.style.opacity=fu; fCalc.style.color=w?'#9AA5A1':C.dim2;
  fName.style.color=w?'#0A0D0C':C.ink;
  fTail.style.color=w?'#5B6663':C.dim;
}
window.seek(0);
</script></body></html>
