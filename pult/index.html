<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пульт цеха</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0D0C'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%232FD38E' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0A0D0C; --ink:#fff; --dim:#6E7A76; --dim2:#49544F;
  --green:#2FD38E; --red:#F0524D; --teal:#3FB7C9;
  --c1:#18201E; --c2:#242D2B; --c3:#38433F;
  --line:rgba(255,255,255,.15); --line2:rgba(255,255,255,.08);
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
a{color:var(--teal)}
.obolochka{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:6px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
   margin:34px 0 12px;font-weight:600}
.put{color:var(--dim2);font-size:13px}
.instr{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);
  color:var(--dim)}
.tag.da{color:var(--green);border-color:rgba(47,211,142,.35)}
.tag.net{color:var(--red);border-color:rgba(240,82,77,.35)}
.versiya{margin-top:10px;font-size:13px;color:var(--dim);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.versiya .svezho{color:var(--green)}
.versiya .staro{color:var(--teal)}
.versiya button{padding:5px 11px;font-size:13px}
.trevoga{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:14px;
  background:rgba(63,183,201,.1);border:1px solid rgba(63,183,201,.35);color:var(--teal)}
/* Цвета марок проверены scripts/validate_palette.js на тёмной карточке
   #18201E: полоса светлоты, порог насыщенности, разделимость для дальтонизма
   (ΔE 16.6), обычное зрение (29.6) и контраст — все пять проходят.
   Брендовые #2FD38E и #3FB7C9 не прошли по светлоте, поэтому у марок свои
   шаги тех же тонов. */
.lenta{width:100%;display:block;overflow:visible}
.legenda{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;
  color:var(--dim);margin:-2px 0 14px}
.legenda i{display:inline-block;margin-right:6px;vertical-align:middle}
.klyuch-stolb{width:7px;height:12px;border-radius:2px;background:#3A4541}
.klyuch-sklejka{width:2px;height:14px;background:#EE5A52}
.klyuch-perehod{width:9px;height:9px;border-radius:50%;background:#17A2BC}
.klyuch-blok{width:16px;height:9px;border-radius:3px;background:#23A874}
.podskazka{position:fixed;pointer-events:none;z-index:50;background:#0F1513;
  border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;
  color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;
  max-width:260px;line-height:1.45}
.podskazka b{font-variant-numeric:tabular-nums}
.podskazka .tihо{color:var(--dim)}
.sverka{display:grid;grid-template-columns:1fr auto auto;gap:3px 14px;
  font-size:13.5px;align-items:center;margin-top:8px}
.sverka .zn{font-variant-numeric:tabular-nums;text-align:right}
.sverka .nm{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px;
  text-align:right;min-width:78px}
.sverka .imya{color:var(--dim)}
.sverka .bed .imya,.sverka .bed .zn{color:var(--ink)}
.znak{display:inline-block;width:16px;text-align:center;font-size:12px}
.znak.da{color:var(--green)} .znak.net{color:#EE5A52}
.tg-post{white-space:pre-wrap;background:#0F1513;border:1px solid var(--line2);
  border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;
  max-height:340px;overflow:auto}
.tg-prompt{white-space:pre-wrap;background:#0F1513;border:1px solid var(--line2);
  border-radius:12px;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;
  color:#c8d3cf;max-height:200px;overflow:auto;margin-top:10px}
.ryad-radar{display:grid;grid-template-columns:1fr 84px;gap:4px 12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line2)}
.ryad-radar:last-child{border:0}
.ryad-radar .imya{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ryad-radar .kanal{font-size:12px;color:var(--dim)}
.ryad-radar .chislo{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.setka{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.karta{background:var(--c1);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.karta h3{margin:0 0 4px;font-size:16px}
.zachem{color:var(--dim);font-size:13px;margin:0 0 12px}
.ryad{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;
  background:var(--c3);color:var(--ink);transition:filter .15s}
button:hover:not(:disabled){filter:brightness(1.25)}
button:disabled{opacity:.4;cursor:not-allowed}
button.glav{background:var(--green);color:#06130D;font-weight:600}
button.stop{background:transparent;border:1px solid var(--red);color:var(--red)}
input,select{font:inherit;background:var(--c2);color:var(--ink);border:1px solid var(--line2);
  border-radius:10px;padding:7px 10px;min-width:0}
input[type=number]{width:74px}
label.gal{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
.sost{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--c2);color:var(--dim)}
.sost.идёт{color:var(--teal);background:rgba(63,183,201,.12)}
.sost.готово{color:var(--green);background:rgba(47,211,142,.12)}
.sost.ошибка{color:var(--red);background:rgba(240,82,77,.12)}
pre.log{background:#070909;border:1px solid var(--line2);border-radius:10px;margin:12px 0 0;
  padding:10px;max-height:260px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;
  color:#c8d3cf;white-space:pre-wrap;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;
   letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.shag{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c3);margin-right:5px}
.shag.est{background:var(--green)}
.shagi{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.shagi span.est{color:var(--ink)}
video{width:100%;border-radius:10px;background:#000;display:block}
.primer{background:var(--c1);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.primer img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#000}
.primer .telo{padding:10px 12px}
.chisla{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;color:var(--dim);margin-top:6px}
.chisla b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
pre.md{background:var(--c1);border:1px solid var(--line2);border-radius:var(--r);padding:14px;
  max-height:420px;overflow:auto;font:12.5px/1.6 ui-monospace,Consolas,monospace;
  color:#c8d3cf;white-space:pre-wrap}
.zapusk{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2)}
.zapusk:last-child{border:0}
.tochka{width:8px;height:8px;border-radius:50%;flex:none}
.tochka.ok{background:var(--green)} .tochka.plohо{background:var(--red)}
.tochka.idet{background:var(--teal);animation:puls 1.2s infinite}
@keyframes puls{50%{opacity:.25}}
.tihо{color:var(--dim);font-size:13px}
@media(max-width:560px){.obolochka{padding:16px 12px 60px}h1{font-size:22px}}
</style>

<div class="obolochka">
  <header>
    <h1>Пульт цеха</h1>
    <span class="put" id="put"></span>
  </header>
  <div class="instr" id="instr"></div>
  <div id="versiya" class="versiya"></div>

  <h2>Процессы</h2>
  <div class="setka" id="zadachi"></div>

  <h2>Ролики</h2>
  <table><thead><tr><th>Ролик</th><th>Стадии</th><th style="width:150px">Готово</th></tr></thead>
    <tbody id="roliki"></tbody></table>
  <div class="setka" id="video" style="margin-top:14px"></div>

  <h2>Радар</h2>
  <div id="radar" class="tihо"></div>
  <div class="karta" id="vybrosy" style="margin-bottom:14px"></div>
  <pre class="md" id="radarmd">…</pre>

  <h2>Приёмка: наши ролики против нормы</h2>
  <div class="karta" id="priemka"></div>

  <h2>Телеграм: пост дня</h2>
  <div class="karta" id="telegram"></div>

  <h2>Ритм: чужие и наши на одной шкале</h2>
  <div class="legenda">
    <span><i class="klyuch-stolb"></i>движение в кадре</span>
    <span><i class="klyuch-sklejka"></i>жёсткая склейка</span>
    <span><i class="klyuch-perehod"></i>переход с расфокусом</span>
    <span><i class="klyuch-blok"></i>наш блок речи</span>
  </div>
  <div class="karta" id="ritm"></div>

  <h2>Разборы чужих роликов</h2>
  <div class="setka" id="primeri"></div>

  <h2>GitHub</h2>
  <div class="karta" id="gh">
    <div class="tihо">загружаю последние запуски…</div>
  </div>
</div>

<script>
const REPO = 'MrTailsGH/lanskoy-motion';
const $ = s => document.querySelector(s);
const el = (t, k, x) => { const e = document.createElement(t); if(k) e.className = k;
  if(x !== undefined) e.textContent = x; return e; };
const срок = ts => ts ? new Date(ts*1000).toLocaleString('ru-RU',
  {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

let СОСТ = null, ХВОСТ = {}, ОТКРЫТ = {};

async function тянуть(){
  const r = await fetch('/api/sostoyanie'); СОСТ = await r.json(); рисовать();
}

function рисовать(){
  $('#put').textContent = СОСТ.цех;
  const i = СОСТ.инструменты, ин = $('#instr'); ин.innerHTML='';
  for (const [имя, есть] of Object.entries(i))
    ин.append(el('span','tag '+(есть?'da':'net'), (есть?'✓ ':'✕ ')+имя));

  рисоватьВерсию();
  рисоватьЗадачи();
  рисоватьРолики();

  const рд = СОСТ.радар;
  $('#radar').textContent = `каналов ${рд.каналов} · снимков истории ${рд.снимков} · отчёт ${срок(рд.отчёт)}`;

  рисоватьПриёмку();
  рисоватьТелеграм();
  рисоватьРитм();
  рисоватьВыбросы();

  const п = $('#primeri'); п.innerHTML='';
  if(!СОСТ.primeri.length) п.append(el('div','tihо','пока ничего не разобрано'));
  for(const v of СОСТ.primeri){
    const к = el('div','primer');
    if(v.кадр){ const im = el('img'); im.src = '/fayl/'+v.кадр; im.loading='lazy'; к.append(im); }
    const т = el('div','telo'); т.append(el('div',null,v.имя));
    const ч = el('div','chisla');
    for(const [подпись, зн] of Object.entries(v.числа||{})){
      if(зн === null || зн === undefined) continue;
      ч.append(el('span',null,подпись)); ч.append(el('b',null,String(зн)));
    }
    т.append(ч); к.append(т); п.append(к);
  }
}

let СВЕЖЕЕ = null;   // последний коммит на GitHub, если удалось спросить

function рисоватьВерсию(){
  const в = СОСТ.версия || {}, о = $('#versiya'); о.innerHTML='';
  if(!в.коммит){ о.append(el('span',null,'папка не из git — обновлять нечем')); return; }
  о.append(el('span',null, 'версия ' + в.коммит + ' · ' +
    (в.когда ? new Date(в.когда).toLocaleString('ru-RU',
      {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '')));
  if(в.правлено) о.append(el('span','tihо','· есть правки на этой машине'));

  const отстал = СВЕЖЕЕ && в.полный && СВЕЖЕЕ !== в.полный;
  if(отстал){
    о.append(el('span','staro','· на GitHub есть свежее'));
    const кн = el('button',null,'Обновить'); кн.onclick = () => пуск('obnovit');
    о.append(кн);
  } else if(СВЕЖЕЕ){
    о.append(el('span','svezho','· свежее некуда'));
  }

  // Сервер прочитал свой код при запуске: обновление на лету не подхватится.
  let т = document.getElementById('trevoga');
  if(в.устарел){
    if(!т){ т = el('div','trevoga'); т.id='trevoga';
      т.textContent = 'Пульт обновился, но работает по старому коду. ' +
        'Закройте чёрное окно и откройте значок заново.';
      о.after(т); }
  } else if(т) т.remove();
}

function рисоватьЗадачи(){
  const о = $('#zadachi');
  for(const [zid, z] of Object.entries(СОСТ.список)){
    let к = document.getElementById('z-'+zid);
    if(!к){
      к = el('div','karta'); к.id = 'z-'+zid;
      к.append(el('h3',null,z.имя), el('p','zachem',z.зачем));
      const ряд = el('div','ryad'); ряд.id = 'ryad-'+zid;

      if(zid==='snimok'){
        const n = el('input'); n.type='number'; n.value=2; n.min=1; n.max=20; n.id='top';
        ряд.append(el('span','tihо','сверху'), n);
      }
      if(zid==='razbor'){
        const u = el('input'); u.placeholder='https://youtube.com/watch?v=…';
        u.id='url'; u.style.width='100%'; u.style.marginBottom='8px';
        к.append(u);
      }
      if(zid==='fayl'){
        const s2 = el('select'); s2.id='fayl'; s2.style.flex='1 1 180px';
        ряд.append(s2);
      }
      if(['vyravnivanie','sborka','zvuk'].includes(zid)){
        const s = el('select'); s.id='rolik-'+zid;
        for(const r of СОСТ.ролики) s.append(new Option(r.имя, r.имя));
        ряд.append(s);
      }
      if(['snimok','razbor'].includes(zid)){
        const pr = el('input'); pr.id='proxy-'+zid; pr.style.width='100%';
        pr.style.marginBottom='8px';
        pr.placeholder='прокси, если YouTube закрыт: socks5://127.0.0.1:1080';
        pr.value = localStorage.getItem('proxy') || '';
        pr.oninput = () => {
          localStorage.setItem('proxy', pr.value);
          for(const z of ['snimok','razbor']){
            const д = document.getElementById('proxy-'+z);
            if(д && д !== pr) д.value = pr.value;
          }
        };
        к.append(pr);
        const l = el('label','gal'); const c = el('input'); c.type='checkbox';
        c.id='push-'+zid; c.checked = true;
        l.append(c, document.createTextNode('отправить в репозиторий'));
        ряд.append(l);
      }

      const кн = el('button','glav','Запустить'); кн.id='pusk-'+zid;
      кн.onclick = () => пуск(zid);
      const ст = el('button','stop','Стоп'); ст.id='stop-'+zid;
      ст.onclick = () => fetch('/api/stop',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:zid})});
      const метка = el('span','sost'); метка.id='sost-'+zid;
      ряд.append(кн, ст, метка);
      к.append(ряд);
      const лог = el('pre','log'); лог.id='log-'+zid; лог.style.display='none';
      к.append(лог);
      о.append(к);
    }
    if(zid==='fayl'){
      const в = document.getElementById('fayl');
      const было = в.value;
      const надо = (СОСТ.вход||[]).join('|');
      if(в.dataset.спис !== надо){
        в.innerHTML=''; в.dataset.спис = надо;
        if(!(СОСТ.вход||[]).length) в.append(new Option('положите ролик в папку vhod',''));
        for(const f of (СОСТ.вход||[])) в.append(new Option(f, f));
        if(было) в.value = было;
      }
    }
    const s = СОСТ.задачи[zid] || {статус:'ждёт'};
    const метка = document.getElementById('sost-'+zid);
    метка.className = 'sost ' + s.статус;
    метка.textContent = s.статус + (s.секунд !== undefined && s.статус==='идёт' ? ` ${s.секунд} с` : '')
      + (s.статус==='ошибка' ? ` (код ${s.код})` : '');
    document.getElementById('pusk-'+zid).disabled = s.статус==='идёт' || нельзя(zid);
    document.getElementById('stop-'+zid).style.display = s.статус==='идёт' ? '' : 'none';
    if(s.статус!=='ждёт') хвостЛога(zid);
  }
}

function нельзя(zid){
  const i = СОСТ.инструменты;
  if(zid==='sborka') return !(i.bash && i.node && i.ffmpeg);
  if(zid==='zvuk' || zid==='fayl') return !i.ffmpeg;
  if(zid==='snimok'||zid==='razbor') return !(i.ytdlp && i.ffmpeg);
  return false;
}

async function пуск(zid){
  const п = {};
  if(zid==='snimok') п.top = +document.getElementById('top').value;
  if(zid==='razbor') п.url = document.getElementById('url').value;
  if(['snimok','razbor'].includes(zid)){
    п.push = document.getElementById('push-'+zid).checked;
    п.proxy = document.getElementById('proxy-'+zid).value;
  }
  if(zid==='fayl') п.fayl = document.getElementById('fayl').value;
  const с = document.getElementById('rolik-'+zid); if(с) п.rolik = с.value;
  ХВОСТ[zid] = 0;
  const л = document.getElementById('log-'+zid); л.textContent=''; л.style.display='';
  const о = await (await fetch('/api/pusk',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:zid, параметры:п})})).json();
  if(о.ошибка) л.textContent = 'не вышло: ' + о.ошибка;
  тянуть();
}

async function хвостЛога(zid){
  const л = document.getElementById('log-'+zid);
  const от = ХВОСТ[zid] || 0;
  const о = await (await fetch(`/api/log?id=${zid}&ot=${от}`)).json();
  if(о.текст){
    л.style.display='';
    const внизу = л.scrollTop + л.clientHeight >= л.scrollHeight - 30;
    л.textContent += о.текст;
    if(внизу) л.scrollTop = л.scrollHeight;
  }
  ХВОСТ[zid] = о.конец;
}

function рисоватьРолики(){
  const т = $('#roliki'); т.innerHTML='';
  for(const r of СОСТ.ролики){
    const tr = el('tr');
    tr.append(el('td',null,r.имя));
    const td = el('td'); const ш = el('div','shagi');
    for(const s of r.шаги){
      const x = el('span', s.есть?'est':'');
      x.append(el('i','shag'+(s.есть?' est':'')), document.createTextNode(s.имя));
      ш.append(x);
    }
    td.append(ш); tr.append(td);
    tr.append(el('td','tihо', r.готов + ' из ' + r.шаги.length +
      (r.когда ? ' · ' + срок(r.когда) : '')));
    т.append(tr);
  }
  const в = $('#video'); в.innerHTML='';
  for(const r of СОСТ.ролики.filter(x=>x.видео)){
    const к = el('div','karta');
    к.append(el('div','zachem', r.имя + ' · ' + r.видео));
    const v = document.createElement('video'); v.controls = true; v.preload='metadata';
    v.style.maxHeight='420px'; v.style.margin='0 auto';
    v.src = '/fayl/' + r.видео; к.append(v); в.append(к);
  }
}


// ── графика ────────────────────────────────────────────────────────────
// Одна шкала времени на все ленты: чужие ролики и наши рисуются в одном
// масштабе, иначе сравнивать ритм бессмысленно.
const МАРКИ = {движение:'#3A4541', склейка:'#EE5A52', переход:'#17A2BC', блок:'#23A874'};
const ПОЛЕ = {слева:0, справа:0, верх:10, низ:20};
let ПОДСКАЗКА = null;

function подсказка(){
  if(!ПОДСКАЗКА){
    ПОДСКАЗКА = el('div','podskazka');
    document.body.append(ПОДСКАЗКА);
  }
  return ПОДСКАЗКА;
}

function следить(марка, текст){
  марка.style.cursor = 'default';
  марка.addEventListener('mouseenter', e => {
    const п = подсказка(); п.innerHTML = текст; п.style.opacity = 1;
  });
  марка.addEventListener('mousemove', e => {
    const п = подсказка();
    const x = Math.min(e.clientX + 14, innerWidth - п.offsetWidth - 8);
    п.style.left = x + 'px';
    п.style.top = Math.max(8, e.clientY - п.offsetHeight - 12) + 'px';
  });
  марка.addEventListener('mouseleave', () => { подсказка().style.opacity = 0; });
}

function svg(имя, атр){
  const э = document.createElementNS('http://www.w3.org/2000/svg', имя);
  for(const k in (атр||{})) э.setAttribute(k, атр[k]);
  return э;
}

function шкалаВремени(полотно, ш, высота, предел){
  // Ось — волосяная линия и круглые числа под ней, ничего больше.
  const y = высота - ПОЛЕ.низ;
  полотно.append(svg('line', {x1:0, y1:y, x2:ш, y2:y,
    stroke:'rgba(255,255,255,.15)', 'stroke-width':1}));
  const шаг = предел > 90 ? 20 : 10;
  for(let t = 0; t <= предел; t += шаг){
    const x = t / предел * ш;
    полотно.append(svg('line', {x1:x, y1:y, x2:x, y2:y+4,
      stroke:'rgba(255,255,255,.15)', 'stroke-width':1}));
    const п = svg('text', {x: Math.min(x, ш-14), y: y+16, fill:'#6E7A76',
      'font-size':11, 'text-anchor': t === 0 ? 'start' : 'middle'});
    п.textContent = t + (t === 0 ? ' с' : '');
    полотно.append(п);
  }
}

function лентаЧужого(в, ш, предел){
  const H = 96, y0 = H - ПОЛЕ.низ, л = в.лента;
  const полотно = svg('svg', {class:'lenta', width:ш, height:H,
    viewBox:`0 0 ${ш} ${H}`});
  шкалаВремени(полотно, ш, H, предел);
  const X = t => t / предел * ш;

  // Движение: столбик от оси, высота — величина изменения кадра.
  // Корень, а не линейная шкала: пики на склейках в двести раз выше
  // обычного шевеления и задавили бы всё остальное.
  const ВЫС = п => 6 + 44 * Math.sqrt(Math.min(п, 20) / 20);
  for(const с of л.движение){
    const w = Math.max(2.5, Math.min(24, X(с.длит) - X(0)));
    const h = ВЫС(с.пик);
    const r = svg('rect', {x: X(с.t), y: y0 - h, width: w, height: h,
      rx: Math.min(2, w/2), fill: МАРКИ.движение});
    следить(r, `<b>${с.t} с</b> · движение<br><span class="tihо">длится ${с.длит} с</span>`);
    полотно.append(r);
  }
  // Склейка: линия во всю высоту. Событий мало, они должны быть видны сразу.
  for(const t of л.склейки){
    const л2 = svg('line', {x1:X(t), y1:ПОЛЕ.верх, x2:X(t), y2:y0,
      stroke:МАРКИ.склейка, 'stroke-width':2});
    следить(л2, `<b>${t} с</b> · жёсткая склейка`);
    полотно.append(л2);
  }
  // Переход: точка с кольцом цвета карточки, чтобы не слипалась со склейкой.
  for(const п of л.переходы){
    const к = svg('circle', {cx:X(п.t), cy:ПОЛЕ.верх + 2, r:4.5, fill:МАРКИ.переход,
      stroke:'#18201E', 'stroke-width':2});
    следить(к, `<b>${п.t} с</b> · переход<br><span class="tihо">расфокус ×${п.раз}</span>`);
    полотно.append(к);
  }
  // Конец ролика, раз шкала общая.
  полотно.append(svg('line', {x1:X(л.длина), y1:y0-6, x2:X(л.длина), y2:y0+2,
    stroke:'rgba(255,255,255,.35)', 'stroke-width':1}));
  return полотно;
}

function лентаНашего(н, ш, предел){
  const H = 44, y0 = H - ПОЛЕ.низ;
  const полотно = svg('svg', {class:'lenta', width:ш, height:H, viewBox:`0 0 ${ш} ${H}`});
  шкалаВремени(полотно, ш, H, предел);
  const X = t => t / предел * ш;
  н.блоки.forEach((б, i) => {
    const w = Math.max(3, X(б[1]) - X(б[0]) - 2);   // 2 px — промежуток паузы
    const r = svg('rect', {x:X(б[0]), y:y0-14, width:w, height:14, rx:3,
      fill:МАРКИ.блок});
    const пауза = i+1 < н.блоки.length ? (н.блоки[i+1][0] - б[1]).toFixed(2) : null;
    следить(r, `<b>блок ${i+1}</b> · ${б[0]}–${б[1]} с<br>` +
      `<span class="tihо">длится ${(б[1]-б[0]).toFixed(2)} с` +
      (пауза ? `, пауза после ${пауза} с` : '') + `</span>`);
    полотно.append(r);
  });
  return полотно;
}

function предел(){
  const а = (СОСТ.primeri||[]).map(v => (v.лента||{}).длина || 0);
  const б = (СОСТ.наши||[]).map(n => n.длина || 0);
  const в = ((СОСТ.приёмка||{}).ролики||[]).map(р => (р.лента||{}).длина || 0);
  return Math.max(60, Math.ceil(Math.max(...а, ...б, ...в, 0) / 10) * 10);
}

function рисоватьРитм(){
  const о = $('#ritm'); if(!о) return;
  const ш = Math.max(320, о.clientWidth - 28), п = предел();
  о.innerHTML = '';

  // Сначала чужие: высота столбиков — величина изменения кадра.
  for(const v of (СОСТ.primeri||[])){
    if(!(v.лента && v.лента.длина)) continue;
    const л = v.лента;
    const ряд = el('div'); ряд.style.marginBottom = '4px';
    ряд.append(el('div','zachem', `${v.имя} · ${л.длина} с · склеек ${л.склейки.length}` +
      ` · переходов ${л.переходы.length}` +
      (л.покой != null ? ` · покой ${Math.round(л.покой*100)}%` : '')));
    ряд.append(лентаЧужого(v, ш, п));
    о.append(ряд);
  }

  // Наши ролики, измеренные тем же razbor.py: прямое сравнение, а не
  // приблизительное — те же склейки и переходы, снятые с картинки.
  const свои = ((СОСТ.приёмка||{}).ролики || []).filter(р => р.лента && р.лента.длина);
  if(свои.length){
    const ч = el('div'); ч.style.cssText =
      'border-top:1px solid var(--line2);margin:14px 0 12px';
    о.append(ч);
    о.append(el('div','zachem','Наши ролики, снятые той же линейкой с готового MP4.'));
    for(const р of свои){
      const л = р.лента;
      const ряд = el('div'); ряд.style.marginBottom = '4px';
      ряд.append(el('div','zachem', `${р.имя} · ${л.длина} с · склеек ${л.склейки.length}` +
        ` · переходов ${л.переходы.length}` +
        (л.покой != null ? ` · покой ${Math.round(л.покой*100)}%` : '')));
      ряд.append(лентаЧужого({лента:л}, ш, п));
      о.append(ряд);
    }
  }

  if(!(СОСТ.наши||[]).length) return;
  const черта = el('div'); черта.style.cssText =
    'border-top:1px solid var(--line2);margin:14px 0 12px';
  о.append(черта);
  о.append(el('div','zachem','Наши ролики: блоки дорожки. Промежутки — паузы, ' +
    'на них живут переходы сцены.'));
  for(const н of СОСТ.наши){
    const ряд = el('div'); ряд.style.marginBottom = '2px';
    ряд.append(el('div','zachem', `${н.имя} · ${н.длина} с · ${н.блоки.length} блоков`));
    ряд.append(лентаНашего(н, ш, п));
    о.append(ряд);
  }
}

function рисоватьПриёмку(){
  const о = $('#priemka'); if(!о) return;
  const п = СОСТ.приёмка || {};
  о.innerHTML = '';
  if(!п.готово){
    о.append(el('div','tihо', 'приёмка пока не считается: ' + (п.почему||'')));
    return;
  }
  if(!(п.ролики||[]).length){
    о.append(el('div','tihо',
      'замеров ещё нет — нажмите «Приёмка своих роликов» в процессах'));
    return;
  }
  о.append(el('div','zachem',
    'Норма посчитана из разобранных чужих роликов. Громкость задаёт площадка: −14 LUFS.'));
  const сетка = el('div','setka'); сетка.style.marginTop = '12px';
  for(const р of п.ролики){
    const к = el('div'); к.style.cssText =
      'background:var(--c2);border-radius:12px;padding:12px 14px';
    const беды = р.строки.filter(с => !с.ладно).length;
    к.append(el('div',null, р.имя + (беды ? ` · расхождений ${беды}` : ' · всё в норме')));
    const т = el('div','sverka');
    for(const с of р.строки){
      const и = el('span','imya', с.имя);
      const з = el('span','zn', String(с.значение));
      const н = el('span','nm', 'норма ' + с.норма);
      if(!с.ладно){ и.style.color='var(--ink)'; з.style.color='var(--ink)'; }
      const зн = el('span','znak ' + (с.ладно ? 'da' : 'net'), с.ладно ? '✓' : '✕');
      н.append(зн);
      т.append(и, з, н);
    }
    к.append(т);
    сетка.append(к);
  }
  о.append(сетка);
}

function рисоватьТелеграм(){
  const о = $('#telegram'); if(!о) return;
  const дни = СОСТ.телеграм || [];
  if(!дни.length){ о.innerHTML=''; о.append(el('div','tihо','нет TG-30-dney.md')); return; }
  let n = +(localStorage.getItem('tgden') || 1);
  n = Math.min(дни.length, Math.max(1, n));
  if(о.dataset.день === String(n)) return;      // перерисовываем только при смене
  о.dataset.день = String(n);
  const д = дни.find(x => x.день === n) || дни[0];
  о.innerHTML = '';

  const шапка = el('div','ryad');
  const назад = el('button',null,'‹'); назад.onclick = () => {
    localStorage.setItem('tgden', Math.max(1, n-1)); о.dataset.день=''; рисоватьТелеграм(); };
  const вперёд = el('button',null,'›'); вперёд.onclick = () => {
    localStorage.setItem('tgden', Math.min(дни.length, n+1)); о.dataset.день=''; рисоватьТелеграм(); };
  шапка.append(назад, вперёд, el('span',null, `День ${д.день} · ${д.заголовок}`));

  const копия = (текст, кнопка, что) => {
    navigator.clipboard.writeText(текст).then(() => {
      const было = кнопка.textContent;
      кнопка.textContent = 'скопировано';
      setTimeout(() => кнопка.textContent = было, 1400);
    }).catch(() => кнопка.textContent = 'не вышло — выделите руками');
  };
  const кп = el('button','glav','Скопировать пост');
  кп.onclick = () => копия(д.пост, кп);
  const кпр = el('button',null,'Скопировать промпт');
  кпр.onclick = () => копия(д.промпт, кпр);
  шапка.append(кп, кпр);
  о.append(шапка);

  const пост = el('div','tg-post'); пост.textContent = д.пост;
  о.append(пост);
  if(д.промпт){
    const пр = el('div','tg-prompt'); пр.textContent = д.промпт;
    о.append(пр);
  }
}

function рисоватьВыбросы(){
  const о = $('#vybrosy'); if(!о) return;
  const ряды = СОСТ.радартоп || [];
  о.innerHTML = '';
  о.append(el('div','zachem',
    'Выбросы относительно своего канала: просмотры, делённые на медиану канала.'));
  if(!ряды.length){ о.append(el('div','tihо','отчёта радара ещё нет')); return; }
  const макс = Math.max(...ряды.map(р => р.индекс));
  for(const р of ряды){
    const ряд = el('div','ryad-radar');
    const слева = el('div');
    const a = document.createElement('a');
    a.href = р.url; a.target = '_blank'; a.className = 'imya';
    a.style.display = 'block'; a.textContent = р.название;
    слева.append(a, el('div','kanal', `${р.канал} · ${р.всего}`));
    ряд.append(слева);
    ряд.append(el('div','chislo', '×' + р.индекс));

    // Полоса индекса: один тон на все ряды — ролики это не шкала величин,
    // а просто разные ролики. Длина уже кодирует число.
    const ш = Math.max(200, о.clientWidth - 140);
    const полотно = svg('svg', {width:ш, height:14, viewBox:`0 0 ${ш} 14`});
    const w = Math.max(3, р.индекс / макс * ш);
    const b = svg('rect', {x:0, y:2, width:w, height:10, rx:4, fill:МАРКИ.переход});
    следить(b, `<b>×${р.индекс}</b> к медиане канала<br>` +
      `<span class="tihо">${р.канал} · всего ${р.всего}</span>`);
    полотно.append(b);
    const ячейка = el('div'); ячейка.style.gridColumn = '1 / -1';
    ячейка.append(полотно);

    // Рост по снимкам — спарклайн, только если есть чему расти.
    const р2 = (р.рост||[]).filter(v => typeof v === 'number');
    if(р2.length >= 2 && Math.max(...р2) > Math.min(...р2)){
      const шс = 120, hс = 20, мин = Math.min(...р2), макс2 = Math.max(...р2);
      const сп = svg('svg', {width:шс, height:hс, viewBox:`0 0 ${шс} ${hс}`});
      const точки = р2.map((v,i) => [i/(р2.length-1)*(шс-6)+3,
        hс-3 - (v-мин)/(макс2-мин)*(hс-8)]);
      сп.append(svg('polyline', {points: точки.map(t=>t.join(',')).join(' '),
        fill:'none', stroke:'#6E7A76', 'stroke-width':2,
        'stroke-linejoin':'round', 'stroke-linecap':'round'}));
      const к = точки[точки.length-1];
      сп.append(svg('circle', {cx:к[0], cy:к[1], r:4, fill:МАРКИ.переход,
        stroke:'#18201E', 'stroke-width':2}));
      следить(сп, `рост по снимкам радара<br><span class="tihо">` +
        р2.map(v=>v.toLocaleString('ru-RU')).join(' → ') + `</span>`);
      сп.style.marginLeft = '10px';
      ячейка.style.display = 'flex'; ячейка.style.alignItems = 'center';
      ячейка.append(сп);
    }
    ряд.append(ячейка);
    о.append(ряд);
  }
}

// ── GitHub: публичный репозиторий читается без ключа ──────────────────
async function свежесть(){
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/main`);
    const d = await r.json();
    if(d && d.sha){ СВЕЖЕЕ = d.sha; if(СОСТ) рисоватьВерсию(); }
  }catch(e){ /* нет сети — молчим, версия на машине всё равно видна */ }
}

async function гитхаб(){
  const о = $('#gh');
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=8`);
    const d = await r.json();
    о.innerHTML='';
    for(const з of (d.workflow_runs||[])){
      const с = el('div','zapusk');
      const цв = з.status!=='completed' ? 'idet' : (з.conclusion==='success'?'ok':'plohо');
      с.append(el('i','tochka '+цв));
      const a = document.createElement('a'); a.href = з.html_url; a.target='_blank';
      a.textContent = з.name; с.append(a);
      с.append(el('span','tihо', ' · ' + (з.conclusion || з.status) + ' · ' +
        new Date(з.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',
          hour:'2-digit',minute:'2-digit'})));
      о.append(с);
    }
    const низ = el('div','ryad'); низ.style.marginTop='12px';
    const a = document.createElement('a');
    a.href = `https://github.com/${REPO}/actions`; a.target='_blank';
    a.textContent = 'Открыть Actions на GitHub';
    низ.append(a); о.append(низ);
  }catch(e){ о.innerHTML=''; о.append(el('div','tihо','GitHub не отвечает: '+e.message)); }
}

async function радармд(){
  const о = await (await fetch('/api/tekst?p=radar/RADAR.md')).json();
  $('#radarmd').textContent = о.текст || 'отчёта ещё нет — запустите радар';
}

addEventListener('resize', () => { if(СОСТ) рисовать(); });
