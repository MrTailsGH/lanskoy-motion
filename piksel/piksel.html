/* ═══════════════════════════════════════════════════════════════════
   ПИКСЕЛЬ · тест №3 · 1080×1920 · 30 fps · 120 с
   Наш стиль (тёмный фон, зелёный/бирюзовый/красный канала, Golos) +
   пиксель-арт (упорядоченный растр Байера на рампах канала, точечная
   нарезка Golos, трассировка лучей в низком разрешении) + язык движения
   «Лаборатории»: точка с физикой, частицы в ₽, маршрут, склейки в бит,
   изометрический график, сеть и туннель, диафрагма, окна-бенто, воронка.
   Подача — ретро-игра: восемь уровней, очки, «ПРОДОЛЖИТЬ?».
   Всё — чистая функция seek(t); случайность — rnd(i). Сцена строится
   после загрузки шрифтов и поднимает window.READY.

const W=1080,H=1920,FPS=30,DUR=120;
window.META={FPS,DUR,FRAMES:DUR*FPS};
window.T={src:'пиксель, без голоса',DUR,B:[]};

const C={bg:'#0A0D0C',ink:'#FFFFFF',dim:'#6E7A76',dim2:'#49544F',green:'#2FD38E',green2:'#1E8F5E',green3:'#12402C',mint:'#7FF0C0',
  teal:'#3FB7C9',teal2:'#1F6570',red:'#F0524D',red2:'#7A2A28',c1:'#18201E',c2:'#242D2B',c3:'#38433F',soft:'#C9D2CF',ink2:'#07201C'};
const RGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
/* рампы для многоуровневого растра: от фона к свету */
const RG=['#0A0D0C','#0F2A1F','#1E8F5E','#2FD38E','#7FF0C0','#E6FFF3'].map(RGB);
const RT=['#0A0D0C','#0F2629','#1F6570','#3FB7C9','#A6E9F2'].map(RGB);

const lerp=(a,b,p)=>a+(b-a)*p;

  return t=>{if(t<=0)return 0;if(t>=1)return 1;let a=0,b=1,u=t;for(let i=0;i<24;i++){u=(a+b)/2;const x=((ax*u+bx)*u+cx)*u;if(x<t)a=u;else b=u;}return ((ay*u+by)*u+cy)*u;};}

const spring=(t,f,d)=>t<=0?0:1-Math.exp(-(d||5.5)*t)*Math.cos((f||11)*t);
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

const PS=s=>s+'px "Press Start 2P"';
const PX=(s,w)=>(w||700)+' '+s+'px "Pixelify Sans"';

/* ═══ РАСТР БАЙЕРА ═══ */

function pline(g,x0,y0,x1,y1,c){g.fillStyle=c;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;
  while(n++<3000){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}

/* ═══ ТОЧЕЧНАЯ НАРЕЗКА ТЕКСТА — наш Golos в пикселях ═══ */
function dm(text,o){const lines=text.split('\n'),c=document.createElement('canvas'),g=c.getContext('2d');
  g.font=o.font;const lh=o.lh||o.size*1.15;let w=0;lines.forEach(l=>w=Math.max(w,g.measureText(l).width));
  c.width=Math.ceil(w)+8;c.height=Math.ceil(lh*lines.length)+8;g.font=o.font;g.textBaseline='top';g.fillStyle='#000';
  lines.forEach((l,i)=>g.fillText(l,o.center?(c.width-g.measureText(l).width)/2:4,4+i*lh));
  const d=g.getImageData(0,0,c.width,c.height).data,p=o.pitch,pts=[];
  for(let y=0;y<c.height;y+=p)for(let x=0;x<c.width;x+=p){const xi=Math.min(c.width-1,Math.round(x+p/2)),yi=Math.min(c.height-1,Math.round(y+p/2));
    if(d[(yi*c.width+xi)*4+3]>110)pts.push([x,y]);}
  const cv=document.createElement('canvas');cv.width=c.width;cv.height=c.height;cv.style.position='absolute';
  const rk=pts.map((_,i)=>rnd(i*13+(o.seed||1)*7));

function dmDraw(m,prog,mode,color){const key=prog.toFixed(3)+mode+color;if(m.key===key)return;m.key=key;
  const g=m.cv.getContext('2d');g.clearRect(0,0,m.w,m.h);g.fillStyle=color;const r=m.dot,lim=(mode==='col'?m.w:m.h)*prog;
  m.pts.forEach(([x,y],i)=>{if(mode==='rnd'?m.rk[i]>=prog:(mode==='col'?x:y)>=lim)return;g.fillRect(x+(m.p-r)/2,y+(m.p-r)/2,r,r);});}

/* ═══ МОНЕТА — трассировка лучей, растр на рампе канала ═══ */
const HM=256,hm=new Float32Array(HM*HM),hgx=new Float32Array(HM*HM),hgy=new Float32Array(HM*HM);
function buildHeight(){const c=document.createElement('canvas');c.width=c.height=HM;const g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,HM,HM);g.filter='blur(2.5px)';g.strokeStyle='#fff';g.lineWidth=14;g.beginPath();g.arc(128,128,114,0,7);g.stroke();
  g.lineWidth=4;g.beginPath();g.arc(128,128,94,0,7);g.stroke();g.fillStyle='#fff';g.font=F(150);g.textAlign='center';g.textBaseline='middle';g.fillText('₽',128,136);
  const d=g.getImageData(0,0,HM,HM).data;for(let i=0;i<HM*HM;i++)hm[i]=d[i*4]/255;
  for(let y=1;y<HM-1;y++)for(let x=1;x<HM-1;x++){const i=y*HM+x;hgx[i]=(hm[i+1]-hm[i-1])*.5;hgy[i]=(hm[i+HM]-hm[i-HM])*.5;}}
function coin(g,cw,ch,cx,cy,R,ry,rx,rz,ramp,clear){
  const im=clear?g.createImageData(cw,ch):g.getImageData(0,0,cw,ch),d=im.data;
  const a=Math.cos(ry),b=Math.sin(ry),c=Math.cos(rx),s=Math.sin(rx),e=Math.cos(rz),f=Math.sin(rz);
  const Ry=[[a,0,b],[0,1,0],[-b,0,a]],Rx=[[1,0,0],[0,c,-s],[0,s,c]],Rz=[[e,-f,0],[f,e,0],[0,0,1]];
  const mul=(A,B)=>A.map((r,i)=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));const M=mul(Rz,mul(Rx,Ry));
  const hh=.13;let Lx=-.5,Ly=-.62,Lz=-.6;const ll=Math.hypot(Lx,Ly,Lz);Lx/=ll;Ly/=ll;Lz/=ll;
  let Hx=Lx,Hy=Ly,Hz=Lz-1;const hl=Math.hypot(Hx,Hy,Hz);Hx/=hl;Hy/=hl;Hz/=hl;
  const dlx=M[2][0],dly=M[2][1],dlz=M[2][2];
  const x0=Math.max(0,Math.floor(cx-R*1.05)),x1=Math.min(cw,Math.ceil(cx+R*1.05)),y0=Math.max(0,Math.floor(cy-R*1.05)),y1=Math.min(ch,Math.ceil(cy+R*1.05));
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const px=(x+.5-cx)/R,py=(y+.5-cy)/R;
    const ox=M[0][0]*px+M[1][0]*py-5*M[2][0],oy=M[0][1]*px+M[1][1]*py-5*M[2][1],oz=M[0][2]*px+M[1][2]*py-5*M[2][2];
    let tb=1e9,qx=0,qy=0,face=0;
    if(Math.abs(dlz)>1e-6)for(const sg of [-1,1]){const t=(sg*hh-oz)/dlz,X=ox+t*dlx,Y=oy+t*dly;if(X*X+Y*Y<=1&&t<tb){tb=t;face=sg;qx=X;qy=Y;}}
    const A=dlx*dlx+dly*dly;if(A>1e-9){const B=2*(ox*dlx+oy*dly),Cq=ox*ox+oy*oy-1,D=B*B-4*A*Cq;if(D>=0){const t=(-B-Math.sqrt(D))/(2*A),Z=oz+t*dlz;

    if(tb>=1e9)continue;

    const nx=M[0][0]*lx+M[0][1]*ly+M[0][2]*lz,ny=M[1][0]*lx+M[1][1]*ly+M[1][2]*lz,nz=M[2][0]*lx+M[2][1]*ly+M[2][2]*lz;

  g.putImageData(im,0,0);}

/* ═══ ЧАШКА — поле расстояний ═══ */
function sdCylY(px,py,pz,r,h){const dx=Math.hypot(px,pz)-r,dy=Math.abs(py)-h;return Math.min(Math.max(dx,dy),0)+Math.hypot(Math.max(dx,0),Math.max(dy,0));}
function sdCup(x,y,z,t){let d=Math.max(sdCylY(x,y,z,.55,.5)-.02,-sdCylY(x,y-.14,z,.46,.5));
  const q=Math.hypot(x-.64,y+.02)-.24;d=Math.min(d,Math.hypot(q,z)-.07);d=Math.min(d,sdCylY(x,y+.57,z,.95,.03)-.01);
  for(let k=0;k<3;k++){const ph=t*1.2+k*2.1,f=(t*.35+k/3)%1,sy=.72+f*.9;d=Math.min(d,Math.hypot(x-(k-1)*.22-.08*Math.sin(ph+sy*4),y-sy,z)-.06*(1.4-f));}
  return d;}
function renderCup(g,N,t,ramp,bg){const im=g.createImageData(N,N),d=im.data;
  const ex=3.1*Math.sin(t*.6),ey=1.4,ez=-3.1*Math.cos(t*.6);
  let fx=-ex,fy=-ey,fz=-ez;const fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;let rx=fz,rz=-fx;const rl=Math.hypot(rx,rz);rx/=rl;rz/=rl;
  const ux=fy*rz,uy=fz*rx-fx*rz,uz=-fy*rx;let Lx=-.5,Ly=.8,Lz=-.45;const ll=Math.hypot(Lx,Ly,Lz);Lx/=ll;Ly/=ll;Lz/=ll;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const u=(x+.5)/N*2-1,v=-((y+.5)/N*2-1);
    let dx=fx*1.9+rx*u+ux*v,dy=fy*1.9+uy*v,dz=fz*1.9+rz*u+uz*v;const dl=Math.hypot(dx,dy,dz);dx/=dl;dy/=dl;dz/=dl;
    let tt=0,hit=false,st=0;for(;st<48;st++){const dd=sdCup(ex+dx*tt,ey+dy*tt,ez+dz*tt,t);if(dd<.0015*(1+tt)){hit=true;break;}tt+=dd;if(tt>9)break;}
    const o=(y*N+x)*4;let col=bg;
    if(hit){const px=ex+dx*tt,py=ey+dy*tt,pz=ez+dz*tt,e=.003;
      const a1=sdCup(px+e,py-e,pz-e,t),a2=sdCup(px-e,py-e,pz+e,t),a3=sdCup(px-e,py+e,pz-e,t),a4=sdCup(px+e,py+e,pz+e,t);
      let nx=a1-a2-a3+a4,ny=-a1-a2+a3+a4,nz=-a1+a2-a3+a4;const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
      const lam=Math.max(0,nx*Lx+ny*Ly+nz*Lz);let hx=Lx-dx,hy=Ly-dy,hz=Lz-dz;const hl=Math.hypot(hx,hy,hz);
      const sp=Math.pow(Math.max(0,(nx*hx+ny*hy+nz*hz)/hl),24),ao=1-st/48*.5;col=dq((.1+.75*lam+.6*sp)*ao,x,y,ramp);}
    d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;}
  g.putImageData(im,0,0);}

/* ════════════════════════════════════════════════════════════════

        const s_=spring(b-.3-(i/NP)*.5,8,5);let x=lerp(ex,p.c[0],cl(s_,0,1.15)),y=lerp(ey,p.c[1],cl(s_,0,1.15));
