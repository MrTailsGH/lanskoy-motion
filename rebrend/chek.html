<script>
/* ═══════════════════════════════════════════════════════════════════
   ЧЕК · манифест бренда · 1080×1920 · 30 fps · 90 с
   Ребрендинг: канал не «про деньги», а про цену решений. Каждый выпуск —

const W=1080,H=1920,FPS=30,DUR=90;

/* палитра приглушённая, типографская: кирпич, охра, мятный дисплей — без кислотных цветов */
const C={paper:'#F3EFE4',paper2:'#E2DBC9',ink:'#151515',night:'#0B0B0C',desk:'#101012',red:'#B23B2E',red2:'#D9594A',redBg:'#8E3128',yel:'#DDB54A',vfd:'#A6E6DF',gray:'#5F5A51'};
const RGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  return t=>{if(t<=0)return 0;if(t>=1)return 1;let a=0,b=1,u=t;for(let i=0;i<24;i++){u=(a+b)/2;const x=((ax*u+bx)*u+cx)*u;if(x<t)a=u;else b=u;}return ((ay*u+by)*u+cy)*u;};}

const STEP=t=>Math.floor(t*15)/15;

const JB=(s,w)=>(w||700)+' '+s+'px "JetBrains Mono"';

function el(par,css,html){const e=document.createElement('div');e.style.position='absolute';

const NS='http://www.w3.org/2000/svg';
function svg(par,w,h,css){const s=document.createElementNS(NS,'svg');s.setAttribute('width',w);s.setAttribute('height',h);

/* ═══ РАСТР БАЙЕРА 8×8 — однобитная печать ═══ */
const BAY=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,

/* ═══ ЗУБЧАТЫЙ КРАЙ — отрыв кассовой ленты ═══ */
function zig(w,h,o){const T=o.tooth||24,D=o.depth||11,pts=[];

  return 'polygon('+pts.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')+')';}

/* ═══ ТОЧЕЧНАЯ МАТРИЦА — текст как у термопринтера ═══

   «горящая» клетка становится точкой. Печать — по строкам (row) или

  const cv=document.createElement('canvas');cv.width=c.width;cv.height=c.height;cv.style.position='absolute';

  ['ЛЕНЬ',C.redBg,C.paper],['СПЕШКА',C.paper,C.ink],['«ПОТОМ»',C.ink,C.red2],['ПОДПИСКИ',C.yel,C.ink],['РЕМОНТ',C.paper,C.ink],['ИПОТЕКА',C.redBg,C.paper],
  ['ПРИВЫЧКИ',C.ink,C.paper],['ВЫБОР',C.yel,C.ink],['ВРЕМЯ',C.paper,C.red],['ВСЁ',C.redBg,C.paper]];
scene(63.6,80.1,r=>{
  const field=el(r,Object.assign({background:C.night},FULL));

  const rec=[...Array(NR)].map((_,i)=>{const e=el(world,{left:((W-RWc)/2)+'px',top:((H-RHc)/2)+'px',width:RWc+'px',height:RHc+'px',background:C.paper,
      backgroundImage:'linear-gradient('+C.ink+','+C.ink+'), repeating-linear-gradient(0deg, rgba(21,21,21,.55) 0 5px, transparent 5px 20px)',

    return {e,x:(rnd(i)*2-1)*980,y:rnd(i+1)*2800,z:rnd(i+2),v:220+rnd(i+3)*260,f1:1+rnd(i+4)*2.2,f2:.6+rnd(i+5)*1.6,ph:rnd(i+6)*6.28,sp:(rnd(i+7)-.5)*300,
      a0:rnd(i+8)*6.28,r0:250+rnd(i+9)*700};});
  const words=el(r,Object.assign({display:'flex',alignItems:'center',justifyContent:'center',zIndex:5},FULL));

  const mc=document.createElement('canvas').getContext('2d');mc.font=UB(100,900);
  const fit=s=>Math.min(360,Math.floor(900/mc.measureText(s).width*100));
  const INTRO=[['У ВСЕГО',64.3],['ЕСТЬ',65.2],['ЧЕК',66.1]];
  const cnt=el(r,{left:'140px',top:'230px',width:'800px',height:'120px',zIndex:6,filter:'drop-shadow(0 0 6px rgba(166,230,223,.5))'});
  const cd=[...Array(8)].map((_,i)=>digit(cnt,i*100+(i>=2?20:0)+(i>=5?20:0),0,78,120,13));
  const streaks=[...Array(40)].map((_,i)=>el(r,{left:'538px',top:'960px',width:'4px',height:'200px',background:'linear-gradient(rgba(243,239,228,0),'+C.paper+')',transformOrigin:'50% 0',zIndex:4,opacity:0}));
  return lt=>{
    /* фон и слова в бит */
    const bi=Math.floor((lt-68)/.5),bu=lt-68-bi*.5,bOn=lt>=68&&lt<76;
    let bg=C.night;
    if(bOn){const B=BEAT[bi];bg=B[1];wd.textContent=B[0];wd.style.color=B[2];wd.style.fontSize=fit(B[0])+'px';
      const m=bi%4,ua=bu+.06;let tf='';
      if(m===0)tf='scale('+lerp(2.2,1,EZ.land(P(ua,0,.14)))+')';else if(m===1)tf='translateY('+((1-EZ.mask(P(ua,0,.22)))*60)+'%)';
      else if(m===2)tf='translateX('+((1-spring(ua,14,7))*(bi%8<4?-1:1)*900).toFixed(0)+'px)';else tf='scale('+(1+.12*Math.exp(-ua*8))+') rotate('+(-6*Math.exp(-ua*10))+'deg)';
      wd.style.transform=tf;vis(words,1);}
    else{const iw=INTRO.filter(q=>lt>=q[1]).pop();if(iw&&lt<67.4){wd.textContent=iw[0];wd.style.color=iw[0]==='ЧЕК'?C.red2:C.paper;wd.style.fontSize=fit(iw[0])+'px';
        wd.style.transform='scale('+lerp(1.6,1,EZ.land(P(lt,iw[1],.18)))+')';vis(words,1);}else vis(words,0);}
    field.style.background=bg;
    /* чеки: падение + полёт камеры; в воронке — спираль к центру */
    const vx=EZ.io(P(lt,76,.8)),coll=EZ.in3(P(lt,76.2,3.1)),wOn=words.style.visibility!=='hidden';
    rec.forEach((o,i)=>{const zz=((o.z*3600+(lt-63.6)*900)%3600)-3200;
      const yy=((o.y+o.v*(lt-63.6))%2800)-1400;
      let x=o.x,y=yy,z=zz;
      if(vx>0){const ang=o.a0+(lt-76)*(1.2+(lt-76)*1.1),rad=o.r0*(1-coll);x=lerp(x,Math.cos(ang)*rad,vx);y=lerp(y,Math.sin(ang)*rad,vx);z=lerp(z,-300*(1-coll),vx);}
      const rx=55*Math.sin(lt*o.f1+o.ph),ry=o.sp*(lt-63.6)*.6,rz=25*Math.sin(lt*o.f2+o.ph*2);

      o.e.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,'+z.toFixed(1)+'px) rotateX('+rx.toFixed(1)+'deg) rotateY('+ry.toFixed(1)+'deg) rotateZ('+rz.toFixed(1)+'deg) scale('+sc.toFixed(3)+')';
      const fog=cl((z+3200)/700)*cl((520-z)/320);o.e.style.opacity=(fog*(wOn?.3:1)*(lt>79.3?0:1)).toFixed(3);});
    /* счётчик «итого» бежит */
    const cv=Math.floor(Math.pow(P(lt,64.0,12),2.2)*99999999),cs=String(cv).padStart(8,' ');
    cd.forEach((dg,i)=>digitSet(dg,cs[i]===' '?' ':cs[i],C.vfd,'rgba(166,230,223,.08)'));vis(cnt,S(lt,63.9,.4)*(1-S(lt,75.8,.4))*(bOn?0:1));
    streaks.forEach((e,i)=>{const a=i/40*360+(lt-76)*(lt-76)*90,d=(lt*1400+i*137)%900;e.style.transform='rotate('+a.toFixed(1)+'deg) translateY('+(80+d).toFixed(0)+'px)';
      e.style.height=(120+500*coll)+'px';e.style.opacity=(vx*(1-P(lt,79.2,.2))*.8).toFixed(3);});
    if(lt>=79.25&&lt<80.1)dissolve(EZ.out(P(lt,79.3,.45)),C.paper,true,false);
  };
});

/* ════════════════════════════════════════════════════════════════
   7 · ИТОГО — логотип выходит из щели кассы, девиз печатью,
   «подписка — 0,00 ₽», штамп ОПЛАЧЕНО, лента уходит вверх — петля
   ════════════════════════════════════════════════════════════════ */
scene(79.7,90,r=>{
  r.style.background=C.paper;
  const all=el(r,Object.assign({},FULL));
  const slotY=760;
  const slot=el(all,{left:'150px',top:(slotY-6)+'px',width:'780px',height:'26px',borderRadius:'13px',background:'#1d1d20',boxShadow:'0 8px 24px rgba(0,0,0,.35)',zIndex:3});
  const clip=el(all,{left:0,top:0,width:W+'px',height:slotY+'px',overflow:'hidden'});
  const TW=740,TH=480;
  const tab=el(clip,{left:((W-TW)/2)+'px',top:0,width:TW+'px',height:TH+'px',background:C.ink,clipPath:zig(TW,TH,{bottom:true,tooth:30,depth:15})});
  const logo=el(tab,{left:0,top:'62px',width:TW+'px',textAlign:'center',font:UB(262,900),color:C.paper,letterSpacing:'-.04em',lineHeight:1},'ЧЕК');
  const dot=el(tab,{left:(TW-92)+'px',top:'40px',width:'48px',height:'48px',background:C.red});
  const sub=el(tab,{left:0,top:'360px',width:TW+'px',textAlign:'center',font:JB(26,800),letterSpacing:'.5em',color:'#8E8A80'},'№ 0001 · КАНАЛ');
  const tg=dm('ПРОБИВАЕМ ЦЕНУ\nЛЮБОГО РЕШЕНИЯ',{font:JB(60,800),size:60,pitch:5,dot:5.0,center:true});place(tg,all,(W-tg.w)/2,800);
  const head=el(all,{left:'120px',top:0,width:'840px',height:'6px',background:'rgba(21,21,21,.35)',visibility:'hidden'});
  const RR=[['ПОДПИСКА НА КАНАЛ','0,00 ₽',JB(34,700)],['ИТОГО','0,00 ₽',UB(44,900)]].map((q,i)=>{
    const row=el(all,{left:'130px',top:(980+i*86)+'px',width:'820px',display:'flex',alignItems:'baseline',whiteSpace:'nowrap',font:q[2],color:C.ink});
    const a=el(row,{position:'relative'}),d=el(row,{position:'relative',flex:'1',overflow:'hidden',font:JB(34,400),color:C.gray,margin:'0 12px'},'. . . . . . . . . . . . . . . . . . . . . . .'),b=el(row,{position:'relative',fontWeight:900});

  return lt=>{
    /* лента с логотипом лезет вверх из щели рывками, потом щель уходит */
    const em=500*EZ.soft(P(STEP(lt),80.1,1.35));
    tab.style.transform='translateY('+(slotY-em).toFixed(1)+'px)';
    const so=EZ.in2(P(lt,81.75,.5));slot.style.transform='translateY('+(so*60)+'px)';vis(slot,S(lt,79.8,.3)*(1-so));
    clip.style.height=(lt<81.8?slotY:H)+'px';
    dot.style.transform='scale('+(lt>=81.9?cl(spring(lt-81.9,12,5),0,1.3):0)+')';

    RR.forEach((o,i)=>{const t0=84.0+i*.9;o.a.textContent=typed(o.q[0],lt,t0,34);vis(o.d,S(lt,t0+.3,.3));o.b.textContent=lt>t0+.55?o.q[1]:'';});

    r.style.background=out>0?'rgb('+[243,239,228].map((c,k)=>Math.round(lerp(c,[11,11,12][k],EZ.io(P(lt,88.9,.9))))).join(',')+')':C.paper;

}

/* ═══ ТРЯСКА: удары ═══ */
const HITS=[[3.0,26],[19.4,6],[23.7,8],[25.8,12],[28.6,22],[39.3,26],[63.65,16],[79.3,34],[86.3,22]];
function shake(t){let x=0,y=0,r=0;HITS.forEach(([a,A],i)=>{const u=t-a;if(u<0||u>.6)return;const e=A*Math.exp(-u*9),f=Math.floor(t*30);
  x+=(rnd(f*3+i)-.5)*2*e;y+=(rnd(f*3+i+11)-.5)*2*e;r+=(rnd(f*3+i+23)-.5)*e*.05;});return [x,y,r];}
const BGT=[[0,C.night],[7.2,C.desk],[21.0,C.night],[35.6,C.paper],[45.2,C.redBg],[63.9,C.night],[80.0,C.paper],[89.4,C.night]];

/* ═══ SEEK ═══ */
let built=false;
window.seek=function(t){
  if(!built)return;
  let bg=C.night;BGT.forEach(q=>{if(t>=q[0])bg=q[1];});bgc.style.background=bg;
  const [sx,sy,sr]=shake(t);cam.style.transform=(sx||sy)?'translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) rotate('+sr.toFixed(3)+'deg)':'';
  if(!(t>40.95&&t<41.62)&&!(t>=79.25&&t<80.1))dissolve(0,C.paper,false,false);
  grain.style.backgroundPosition=(Math.floor(t*30)*37%180)+'px '+(Math.floor(t*30)*53%180)+'px';
  SC.forEach(s=>{const on=t>=s.t0&&t<s.t1;s.root.style.display=on?'block':'none';if(on)s.draw(t);});
  const hv=t>7.4&&t<88.4&&!(t>15.8&&t<21.1);hud.style.visibility=hv?'visible':'hidden';
  {let fb=bg;if(t<8.6||(t>=35.6&&t<45.2)||t>=79.7)fb=C.paper;if(t>=68&&t<76)fb=BEAT[Math.floor((t-68)/.5)][1];
   const c=RGB(fb),lum=(.2126*c[0]+.7152*c[1]+.0722*c[2])/255;hud.style.color=lum>.5?'rgba(21,21,21,.72)':'rgba(243,239,228,.78)';}

};
